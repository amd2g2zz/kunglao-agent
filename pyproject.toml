[project]
name = "kunglao-agent"
version = "0.1.4"
description = "Convergence-driven reverse-engineering orchestrator — Claude Code skill (issue #80 release contract)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-only" }  # dual-licensed: AGPL-3.0 OR commercial (see LICENSE-commercial.md)
# Declared set = modules actually imported by scripts/ hooks/ tools/ tests/
# (verified by tests/test_release_receipt.py::test_pyproject_declares_imported_dependencies).
# cryptography/requests are NOT imported anywhere — do not add them back without an import.
dependencies = [
    "PyYAML>=6.0",
    "pefile>=2023.2.7",
    "capstone>=5.0",
    "jsonschema>=4.0",
    "z3-solver>=4.12",  # opaque-pred (issue #306): guarded import, degrade path exit 2
]

# Dev tooling lives in a PEP 735 dependency group, NOT an optional extra:
# `uv sync` installs dependency groups by default, so a fresh clone can run
# the standard test command right after the documented install command.
[dependency-groups]
dev = [
    "pytest>=8.0",
    # tomllib is 3.11+ stdlib; tests run on the 3.10 floor so the tomli
    # backfill is a dev-only dependency (issue #352).
    "tomli>=2.0; python_version < '3.11'",
    # #564 coverage policy alignment: coverage is OBSERVATION (#463),
    # pytest-cov is wired only so the report lands in CI artifacts;
    # the primary quality metric is Gate 4 (mutmut availability),
    # not a coverage line %. tests/test_coverage_policy_564.py is the
    # drift guard for this declaration.
    "pytest-cov>=5.0",
    # #463 Gate 4 (test effectiveness): mutation testing on changed code.
    "mutmut>=2.4",
    "ruff>=0.6",
]

# NOTE: pytest configuration lives in pytest.ini (single source of truth).
# Do not add [tool.pytest.ini_options] here — two configs would split authority.

# Static-analysis gate (v0.1.2 plan R2 Task 0.3): blunder-level ruleset,
# zero-noise by design — style rules deliberately NOT enabled (existing
# codebase is not style-clean; enabling them would force a 99-script churn).
# Per-PR new code must be ruff-clean; tightening happens per-issue, not here.
[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "E9", "F63", "F7", "F82",
    "E501", "W291", "W293",
    "F401", "F841",
    "C901",
    "B011", "B015",
    "PT007", "PT011", "PT012", "PT018",
]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501", "F841", "PT011", "B011", "PT018"]

