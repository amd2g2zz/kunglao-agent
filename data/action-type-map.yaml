# action-type-map.yaml — 动作类型 → 候选类目映射 (method-graph 唯一手写部分)
#
# 用户纠正: 写死路由表无意义 — method-graph.yaml 的节点必须全部来自环境扫描
# (scripts/method_router_register.py 三源注册: skills/ + settings.json mcpServers + scripts/)。
# 本文件只回答"动作类型需要哪些类目的候选", 不写具体节点:
#   - categories.<name>.keywords: 小写子串匹配注册节点 (id/name + description) → 类目成员
#   - actions.<name>.tier: 该动作的方法节点 tier (1=便宜 .. 3=贵, method_router TIER_COST)
#   - actions.<name>.categories: 候选类目(有序 — 首个类目首个成员 = 主 skill, 其余 = alternatives)
#   - sequence: 动作间工作流衔接 (kind=sequence 边)
#
# 注册器消费: 类目 → 具体注册节点(环境扫描结果) → 生成 nodes + edges。
# 新装 skill / 新配 MCP / 新加脚本 → 重跑注册器 → 路由自动多一条候选; 卸载 → 自动消失。
version: 1
kind: action-type-map

categories:
  static_re:
    keywords: [ghidra, static, disassembl, ida, decompil, reverse, binary, pefile]
  dynamic_re:
    keywords: [frida, x64dbg, debug, dynamic, trace, unicorn, qiling, emulat, runtime, memory]
  strings_ioc:
    keywords: [floss, string, ioc, signature, entropy, indicator, packer, hash]
  cti_osint:
    keywords: [cti, osint, threat, intel, reconnaissance, virustotal, shodan, sandbox]
  verdict_triage:
    keywords: [verdict, triage, score, attribution, evidence, report]
  network_protocol:
    keywords: [network, protocol, packet, pcap, sniffer, traffic, wireshark]
  forensics_memory:
    keywords: [volatility, forensics, memdump, dump, memory]
  malware_exec:
    keywords: [qiling, emulat, sandbox, behavior, detonat, execute, vmware, virtual]
  research_search:
    keywords: [search, web, research, docs, url, anysearch]

actions:
  c2_config_extract:   {tier: 2, categories: [static_re, dynamic_re]}
  command_table:       {tier: 2, categories: [static_re]}
  anti_analysis:       {tier: 2, categories: [static_re]}
  payload_origin:      {tier: 2, categories: [static_re, dynamic_re]}
  dynamic_observe:     {tier: 3, categories: [dynamic_re]}
  protocol_restore:    {tier: 3, categories: [dynamic_re, network_protocol]}
  persistence:         {tier: 3, categories: [dynamic_re, static_re]}
  injection:           {tier: 3, categories: [dynamic_re, static_re]}
  strings_imports:     {tier: 1, categories: [strings_ioc]}
  cti_correlation:     {tier: 1, categories: [cti_osint]}
  family_attribution:  {tier: 1, categories: [cti_osint, verdict_triage]}
  evidence_collection: {tier: 1, categories: [strings_ioc, cti_osint]}

# 工作流衔接 (kind=sequence 边; from/to 必须都是 actions 中的动作)
sequence:
  - [strings_imports, c2_config_extract]
  - [strings_imports, command_table]
  - [strings_imports, protocol_restore]
  - [dynamic_observe, protocol_restore]
  - [cti_correlation, family_attribution]
  - [family_attribution, anti_analysis]
