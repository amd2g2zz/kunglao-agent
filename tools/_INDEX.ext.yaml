    description: "unidbg-harness.java — minimal unidbg harness skeleton — known-variance regions: Library path ({{LIB_PATH}}) and bitness, JNI — Scenario: a captured request's signature/token field is computed inside native code and the algorithm must run (and be observed) outside a device — the emulator harness is the vehicle, the replay gate stays with native-sign-recovery. How: build the emulator, create the Dalvik VM with a JNI provider, load the library from {{LIB_PATH}}, run JNI_OnLoad, resolve {{PACKAGE_NAME}}/{{TARGET_CLASS}} and dispatch {{TARGET_METHOD}} with the {{TARGET_SIGNATURE}} calling shape, with a module-scoped instruction trace and a file resolver installed BEFORE the load. Expected outcome: the target function executing under emulator observation — NOT a validated result: every output is a hypothesis until all captured device pairs replay byte-exact (native-sign-recovery step 6). First build needs JDK + Maven and the remote dependency tree (deployment preconditions: unidbg-env-filling card; scripts/install_unidbg.sh)."
