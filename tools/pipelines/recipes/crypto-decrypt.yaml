schema: plan-recipe/1
id: crypto-decrypt
title: Crypto-layer decryption (crypto-decrypt)
description: >-
  For samples with a crypto:decode signal (crypt32/bcrypt/advapi imports or a
  high-entropy section): ghidra-recon locates crypto API call sites,
  crypto-tool decrypts via the algorithm subcommand, and
  disasm-constant-check validates the plaintext layer's landing points.
steps:
  - tool: ghidra-recon
    input: sample
    output: crypto API call-site locations (CryptDecrypt/BCrypt etc.)
  - tool: crypto-tool
    input: ciphertext bytes + algorithm subcommand (chacha|xor-add|rolling-xor|rsa-unpad)
    output: plaintext layer + --reproduce arguments
  - tool: disasm-constant-check
    input: plaintext layer + code listing (VA-anchored assertions)
    output: byte-exact assertion validation JSON
fallback: [ghidra-decompile-functions, crypto:decode]
verify: crypto-verify
reuse_check: reuse when the same algorithm + arguments already produced a plaintext layer; do not decrypt twice
