schema: plan-recipe/1
id: go-recovery
title: Go symbol recovery (go-recovery)
description: >-
  For samples with languages:go markers (go.buildinfo / runtime.* hints):
  ghidra-recon locates go.buildinfo/pclntab, crypto-tool's go-byte-transform
  subcommand recovers the function-name/string layer, and
  disasm-constant-check validates the recovered layer's landing points.
steps:
  - tool: ghidra-recon
    input: sample
    output: go.buildinfo/pclntab locations + go findings
  - tool: crypto-tool
    input: go-transformed bytes (subcommand go-byte-transform)
    output: recovered function-name/string layer
  - tool: disasm-constant-check
    input: recovered layer + code listing (VA-anchored assertions)
    output: byte-exact assertion validation JSON
fallback: [ghidra-decompile-functions, ghidra:recon]
verify: go-verify
reuse_check: reuse when go symbol-recovery artifacts for the same sample already exist
