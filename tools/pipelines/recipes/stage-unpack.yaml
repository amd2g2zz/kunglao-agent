schema: plan-recipe/1
id: stage-unpack
title: Staged unpacking (stage-unpack)
description: >-
  For samples with overlay / packer markers: first locate the packing layer by
  static reconnaissance, then peel layers with crypto-tool's compression
  subcommands (lzss|lzma-raw|rolling-xor), and finish with a byte-exact check
  via disasm-constant-check.
steps:
  - tool: ghidra-recon
    input: sample + packer/overlay markers
    output: packer verdict + section/overlay layout
  - tool: crypto-tool
    input: compressed/transformed layer bytes (--in, subcommand lzss|lzma-raw|rolling-xor)
    output: unpacked layer bytes + --reproduce arguments
  - tool: disasm-constant-check
    input: unpacked layer + code listing (VA-anchored assertions)
    output: byte-exact assertion validation JSON
fallback: [ghidra-decompile-functions, ghidra:recon]
verify: unpack-verify
reuse_check: reuse existing unpack artifacts for a same-sha256 sample instead of unpacking again
