schema: plan-recipe/1
id: iat-chain
title: Import-table call chain (iat-chain)
description: >-
  For samples with iat intent: ghidra-recon parses the IAT/import table,
  ghidra-scan-pointer scans IAT pointer hits in xref mode, and
  disasm-constant-check anchors the call assertions.
steps:
  - tool: ghidra-recon
    input: sample
    output: IAT/import table parsing
  - tool: ghidra-scan-pointer
    input: IAT address window (--mode xref)
    output: IAT xref / 8-byte pointer scan hits
  - tool: disasm-constant-check
    input: IAT call assertions + code listing
    output: byte-exact assertion validation JSON
fallback: [ghidra:xref-scan, ghidra:recon]
verify: iat-verify
reuse_check: reuse when IAT parsing + xref artifacts for the same sha256 sample already exist
