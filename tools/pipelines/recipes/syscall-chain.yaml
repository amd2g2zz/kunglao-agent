schema: plan-recipe/1
id: syscall-chain
title: Syscall chain (syscall-chain)
description: >-
  For samples with dynamic intent (vm/run/execute/detonate or syscall
  keywords): ghidra-recon locates syscall call sites,
  ghidra-decompile-functions decompiles the call sites, and
  disasm-constant-check anchors the syscall-number assertions.
steps:
  - tool: ghidra-recon
    input: sample
    output: syscall call sites + Nt* API locations
  - tool: ghidra-decompile-functions
    input: call-site addresses (--addresses)
    output: syscall stub decompilation + disasm window
  - tool: disasm-constant-check
    input: decompiled listing + syscall-number assertions
    output: byte-exact assertion validation JSON
fallback: [ghidra-scan-pointer, ghidra:xref-scan]
verify: syscall-verify
reuse_check: reuse when syscall-chain decompilation evidence for the same VAs already exists
