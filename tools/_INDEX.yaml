schema: tools-index/1
purpose: >-
  Machine-readable tool index for the kunglao-agent toolshelf. Each entry is one
  tool with its capability tag, execution tier, cost tier, and input/output
  contract. Validated by tools/validate_index.py (issue #283). Human entry
  points: tools/_INDEX.md (6-category domain index) + tools/_index-<category>.md
  (per-category skeletons, progressive disclosure).

# ---- entry schema (machine contract) ---------------------------------------
#   name:         unique tool id, lowercase kebab-case (e.g. chacha-string-layer)
#   category:     one of crypto|static|ghidra|dynamic|auxiliary|pipelines (== dir name, #340)
#   capability:   "<domain>:<operation>" capability tag, e.g. crypto:decode
#   tier:         T1 static tool | T2 emulation | T3 VM-dynamic
#   cost_tier:    probe | cheap | deep
#   input_output: non-empty input->output contract (str, or {input, output})
#   description:  required English one-liner, 15-40 chars (what it does +
#                 when to choose it) — issue #356 W1, distilled from
#                 input_output/when_not (never invented semantics)
#   when_not:     optional — when NOT to use this tool
#
#   example:
#   - name: chacha-string-layer
#     category: crypto
#     capability: crypto:decode
#     tier: T1
#     cost_tier: cheap
#     input_output: {input: ciphertext byte string, output: plaintext layer}
#     description: Decodes ChaCha layers; pick for stream-cipher blobs
#     when_not: not for non-ChaCha stream encryption
# -----------------------------------------------------------------------------

tools:
  # -- crypto: 8-algorithm CLI (issue #285 absorption) --
  - name: crypto-tool
    category: crypto
    capability: crypto:decode
    description: 8-family crypto decode CLI
    tier: T1
    cost_tier: cheap
    input_output: {input: ciphertext byte string (--in/--in-hex) + subcommand (chacha|xor-add|rolling-xor|lzss|lzma-raw|rsa-unpad|go-byte-transform|va-to-off), output: plaintext/transformed bytes + --reproduce field=value}
    when_not: not for encryption schemes outside these 8 algorithm families; run --self-check first to validate the environment

  # -- ghidra: function-level static reconnaissance (issue #293 absorption, sa-ghidra final) --
  - name: ghidra-recon
    category: ghidra
    capability: ghidra:recon
    description: First-pass Ghidra recon sweep
    tier: T1
    cost_tier: deep
    input_output: {input: sample + --search-terms/--expected-exports/--sha256/--sha1, output: JSON(meta/imports/exports/functions/strings_of_interest/suspicious_api_calls/focus_functions/go/findings)}
    when_not: not for single-function disassembly — use ghidra-decompile-functions

  - name: ghidra-decompile-functions
    category: ghidra
    capability: ghidra:decompile
    description: Decompile pinned functions
    tier: T1
    cost_tier: deep
    input_output: {input: sample + --addresses/--strings/--window/--context, output: JSON(per-target decompiled C + disasm window + string xrefs; --context adds caller/callee ~10-line snippets + xref strings + recovered names, ghidra_context.v1)}
    when_not: not for bulk whole-binary disassembly; for vtable recovery use ghidra-vtable-struct

  - name: ghidra-vtable-struct
    category: ghidra
    capability: ghidra:vtable
    description: Rebuild C++ vtable structs
    tier: T1
    cost_tier: cheap
    input_output: {input: sample + --address/--name/--class/--apply, output: JSON(vtable slot table + function fields; optionally persists structures/labels)}
    when_not: not without a clear vtable address or for text-only tasks

  - name: ghidra-evidence-annotations
    category: ghidra
    capability: ghidra:annotate
    description: Apply/verify TSV annotations
    tier: T1
    cost_tier: cheap
    input_output: {input: sample + --mode apply|verify + --tsv, output: JSON(annotation apply/validation summary; a verify failure raises, fail-closed)}
    when_not: not without an evidence TSV to write back/validate

  - name: ghidra-scan-pointer
    category: ghidra
    capability: ghidra:xref-scan
    description: Xref + raw pointer scanning
    tier: T1
    cost_tier: deep
    input_output: {input: sample + --mode xref|window(--addresses/--center), output: JSON(xref/raw 8-byte pointer scan hits)}
    when_not: not for string location only — use ghidra-decompile-functions

  # -- static: byte-exact disassembly constant validation (issue #284 registration) --
  - name: disasm-constant-check
    category: static
    capability: static:disasm-check
    description: Byte-exact disasm constant check
    tier: T1
    cost_tier: cheap
    input_output: {input: fact/report code listing + PE binary (VA-anchored assertions), output: byte-exact assertion validation JSON(ok/mismatches/errors/skipped)}
    when_not: not when VA-anchored constant validation is unnecessary or there is no binary sample

  # -- static: YARA rule scanning/generation (issue #313, absorbing the findcrypt-yara rule assets) --
  - name: yara-scan
    category: static
    capability: static:yara-scan
    description: YARA rule scan of binaries
    tier: T1
    cost_tier: cheap
    input_output: {input: binary (--binary) + rules file/directory (--rules, built-in crypto-tables by default), output: hit listing (offset/rule/len/preview) + --json/--reproduce}
    when_not: not without a rule-based scanning need; missing yara-python → exit 2 with install guidance

  - name: yara-gen
    category: static
    capability: static:yara-gen
    description: Generate YARA rules
    tier: T1
    cost_tier: probe
    input_output: {input: trait pattern (--hex or --string) + --name + --meta k=v, output: YARA rule text (stdout)}
    when_not: not when detection rules do not need to be generated from analysis findings

  # -- static: 6 zero-dependency static CLIs (issue #278 PR-1b absorption) --
  - name: extract-syscalls
    category: static
    capability: static:syscall-extract
    description: Extract x64 syscall stubs
    tier: T1
    cost_tier: cheap
    input_output: {input: sample bytes (--mode bin) or disassembly text (--mode text), output: syscall stub listing (location/number/name) + --reproduce field=value}
    when_not: not for non-x64-syscall-stub scanning tasks

  - name: stack-strings
    category: static
    capability: static:stack-strings
    description: Rebuild stack-constructed strings
    tier: T1
    cost_tier: cheap
    input_output: {input: sample bytes + --start/--end/--min-len/--dword, output: "[rsp+disp] stack-built string listing (slot/value/writes)"}
    when_not: not without mov byte/dword [rsp+disp] stack-write patterns

  - name: binary-sweep
    category: static
    capability: static:byte-sweep
    description: Byte pattern sweep (url/ip/domain)
    tier: T1
    cost_tier: cheap
    input_output: {input: sample bytes + --kind url|ipv4|domain|all or a custom byte regex via --pattern, output: byte-level pattern hit listing (kind/offset/value)}
    when_not: not for PE section-aware structured string extraction — use the die/floss flow

  - name: strings-classify
    category: static
    capability: static:strings-classify
    description: Entropy/base64 string triage
    tier: T1
    cost_tier: cheap
    input_output: {input: sample bytes + --min-len/--encoding ascii|utf16le|both, output: string classification listing (entropy/printable_ratio/base64/hex) + inventory statistics}
    when_not: not when floss already extracted everything and no entropy/decodability classification is needed

  - name: go-buildinfo-carve
    category: static
    capability: static:buildinfo-carve
    description: Carve Go buildinfo blobs
    tier: T1
    cost_tier: cheap
    input_output: {input: sample bytes + --window/--zero-run, output: Go buildinfo blob listing (offset/go_version/path/mod_count/dep_count/size)}
    when_not: not for non-Go samples (confirm the language with die first)

  - name: rust-dep-strings
    category: static
    capability: static:rust-dep-strings
    description: Carve Rust crate dependency strings
    tier: T1
    cost_tier: cheap
    input_output: {input: sample bytes + --channels registry,crate, output: crate name+version listing with source channel (registry path id / standalone string) + registry ids + registry+ source URLs}
    when_not: not for non-Rust samples (confirm the language with die first); the standalone-crate channel alone is weaker evidence than the registry channel

  - name: call-site-args
    category: static
    capability: static:callsite-args
    description: Call-site args from disasm text
    tier: T1
    cost_tier: cheap
    input_output: {input: disassembly text + --window/--abi x64|x86, output: call-site argument listing (address/target/regs/stack/pushed)}
    when_not: not for register-level dataflow-precise recovery — use ghidra-recon or emulated execution
  - name: pe-analyze
    category: static
    capability: static:pe-parse
    description: PE table parse, structural view
    tier: T1
    cost_tier: cheap
    input_output: {input: sample PE (--binary) + subcommand (headers|sections|imports|exports|resources|overlay|pdb|tls|signature|all), output: the requested PE table/data JSON + --reproduce field=value}
    when_not: not for instruction-level disassembly or function-level views — use disasm-dump / ghidra-recon

  - name: overlay-scan
    category: static
    capability: static:overlay-scan
    description: PE overlay characterization
    tier: T1
    cost_tier: cheap
    input_output: {input: sample PE (--binary) + --mode reloc|true|mz|all, output: overlay characterization JSON (reloc table/entropy/Go evidence/embedded-PE hits)}
    when_not: not when the PE has no overlay or there is no embedded-payload suspicion

  - name: disasm-dump
    category: static
    capability: static:disasm
    description: Capstone disasm per VA list
    tier: T1
    cost_tier: cheap
    input_output: {input: sample PE (--binary) + --rvas/--vas list + optional --prologs/--strings, output: per-address capstone instruction listing JSON (VA→file-offset reuse of tools/_lib/lib_disasm.py)}
    when_not: not for function-level semantics/decompilation — use ghidra-recon / ghidra-decompile-functions

  - name: shellcode-scan
    category: static
    capability: static:shellcode-scan
    description: Shellcode region detection
    tier: T1
    cost_tier: cheap
    input_output: {input: binary blob/PE (--binary) + --scan/--entry/--prologs/--peb/--strings, output: shellcode candidate regions + trait JSON (PEB access/prologues/strings/entry disassembly)}
    when_not: not for non-shellcode/blob detection tasks

  - name: die-probe
    category: static
    capability: static:identify
    description: DIE identify language/packer
    tier: T1
    cost_tier: probe
    input_output: {input: sample PE (--binary) + DIE executable (--die/$KUNGLAO_DIE), output: DIE 5-call merge JSON (language/compiler/packer/entropy/resources); missing die → exit 2 + install guidance}
    when_not: not when DIE is not installed and installing is not allowed

  # -- static: decompiled-C post-processing (issue #306 absorption, C text layer) --
  - name: c-normalize
    category: static
    capability: static:decompile-normalize
    description: Normalize decompiled C idioms
    tier: T1
    cost_tier: cheap
    input_output: {input: decompiled C text (--in or stdin) + --heuristics, output: normalized C (modulo idiom x-(x/N)*N→x%N / dead-store elimination; --heuristics enables undefined4/8 type heuristics) + rule_hits/diff stats; exit 0 transformed/1 unchanged/2 error}
    when_not: not for semantic deobfuscation or expression truth-value decisions — use opaque-pred

  - name: opaque-pred
    category: static
    capability: static:opaque-predicate
    description: Resolve opaque predicates via z3
    tier: T1
    cost_tier: probe
    input_output: {input: C expression (--expr "...") or expression pair (--simplify "lhs -> rhs"), output: always_true/always_false/unknown + simplified constant or MBA rewrite suggestion (z3 32-bit semantics); missing z3 → exit 2 + install guidance}
    when_not: not for non-single-expression truth-value/MBA-equivalence decisions; not when z3-solver is not installed and installing is not allowed

  # -- pipeline: evidence index building (issue #284 registration) --
  - name: build-evidence-index
    category: pipelines
    capability: pipeline:evidence-index
    description: Index evidence with sha256
    tier: T1
    cost_tier: cheap
    input_output: {input: the workspace's raw evidence in evidence/ + analysis_artifacts/, output: evidence/_index.json + _INDEX.md (eid/path/sha256/source_reliability)}
    when_not: not for pure analysis without evidence registration

  # -- aux: legacy PROVEN audit (issue #284 registration) --
  - name: audit-legacy-proven
    category: auxiliary
    capability: aux:proven-audit
    description: Audit legacy PROVEN claims
    tier: T1
    cost_tier: cheap
    input_output: {input: workspace (claim-register.yaml + facts/_INDEX.md), output: legacy PROVEN claim audit (BLIND signature dimension + index traceability)}
    when_not: not needed when no legacy PROVEN claims require audit cleanup

  # -- aux: golden master capture (issue #284 registration) --
  - name: capture-golden
    category: auxiliary
    capability: aux:golden-capture
    description: Capture golden-master fixtures
    tier: T1
    cost_tier: cheap
    input_output: {input: 'the CASES list (synthetic workspaces + CLI arguments)', output: 'tests/fixtures/golden/{manifest.yaml, F-NN/expected/stdout.txt}'}
    when_not: --refresh re-capture is only for contract-change flows; not for routine analysis

  # -- aux: BLIND coverage measurement (issue #284 registration) --
  - name: measure-blind-coverage
    category: auxiliary
    capability: aux:blind-coverage
    description: BLIND coverage of PROVEN facts
    tier: T1
    cost_tier: cheap
    input_output: {input: workspace (claim-register.yaml + verifier_sign_off from facts/*.md), output: BLIND coverage JSON (PROVEN/blind_signed/unverified/coverage)}
    when_not: not needed when blind-verification coverage is not being evaluated

  # -- aux: cold-start token baseline measurement (issue #284 registration) --
  - name: measure-cold-start
    category: auxiliary
    capability: aux:cold-start-metrics
    description: Cold-start token baseline
    tier: T1
    cost_tier: probe
    input_output: {input: workspace state-file inventory (claim-register.yaml/_INDEX/ledger/progress etc.), output: docs/baselines/cold-start-tokens.json (per-file token estimates)}
    when_not: not for non-cold-start-baseline measurement

  # -- aux: prompt-injection sanitization of sample content (issue #307 registration) --
  - name: sanitize-text
    category: auxiliary
    capability: aux:sanitize
    description: Sanitize text vs prompt injection
    tier: T1
    cost_tier: probe
    input_output: {input: sample-derived text (--in/stdin) + --mode zero-width|homoglyph|markers|full + --report-only, output: sanitized text or JSON (zwx_count/homoglyph_count/marker_count/suspicious/sha256) + --reproduce field=value}
    when_not: not needed when the text is not consumed by an LLM worker


  # -- android capability providers (#692 WP1; annotation block design D1) --
  # The registry IS the capability-provider matrix (design D0): multi-provider
  # = multiple entries sharing capability tags. Entries without `provider`
  # are legacy and carry no annotation block (opt-in, no behavior change).
  - name: jadx-decompile
    category: static
    capability: android:java-source
    description: DEX-to-Java decompiler (jadx)
    tier: T1
    cost_tier: deep
    input_output: {input: "APK/JAR via worker-dispatched external jadx CLI (mem-gated by tools/static/apk_mem_gate.py, verdict in evidence/apk_mem_gate.json)", output: "decompiled Java source tree under evidence/"}
    when_not: "not when the apk_mem_gate verdict is smali-only/refuse (blocked - mem budget; the #670 gate is this provider's precondition, not a pipeline stage); not for 1:1 bytecode truth (baksmali-xref)"
    provider: jadx
    produces: [android:java-source]
    requires: [dex, mem_budget_ok, jadx_bin]
    cost_hint: {mem_gb: 4.0, time: deep}
    quality: {android:java-source: high}

  - name: baksmali-xref
    category: static
    capability: android:bytecode-truth
    description: DEX 1:1 smali + xref index
    tier: T1
    cost_tier: deep
    input_output: {input: "APK/DEX (wrapped by tools/static/baksmali_index.py)", output: "evidence/smali_index.json - gitnexus-shape classes/methods/xrefs (#670 wire); the smali text is the 1:1 bytecode truth for fact anchors"}
    when_not: "not for java-like source (jadx-decompile / dexdc-decompile); not for graph RAG queries over source (gitnexus-query)"
    provider: baksmali
    produces: [android:bytecode-truth, android:java-source, android:call-graph, android:dex-rewrite]
    requires: [dex, smali_toolchain]
    cost_hint: {mem_gb: 1.0, time: deep}
    quality: {android:bytecode-truth: high, android:java-source: floor, android:call-graph: floor, android:dex-rewrite: mid}

  - name: apkid-prescan
    category: static
    capability: android:packer-fingerprint
    description: APK packer/compiler fingerprint
    tier: T1
    cost_tier: cheap
    input_output: {input: "APK (wrapped by scripts/apkid_scanner.py)", output: "evidence/apkid.json - packer/compiler/obfuscator/anti-* summary; the obfuscator tag feeds the WP6 deobf prior"}
    when_not: "not on non-Android targets; not a provider for the D0 matrix capabilities - its tags raise priors only"
    provider: apkid
    produces: [android:packer-fingerprint]
    requires: [dex]
    cost_hint: {mem_gb: 0.5, time: cheap}
    quality: {android:packer-fingerprint: high}

  - name: gitnexus-query
    category: static
    capability: android:semantic-query
    description: Graph-RAG source queries, android + js
    tier: T1
    cost_tier: deep
    input_output: {input: "indexed decompiled source tree - jadx/dexdc output (android) OR a recovered JS module tree registered into evidence/<run>.json unpack_out by wakaru/webcrack (#751 js domain); 16 MCP tools via the gitnexus server; index built lazily on claim demand, marker evidence/gitnexus_index.json", output: "dependency/call-chain/execution-flow graph answers via Graph RAG; for web signature-trace posture see references/re-library/web-re-quickref.md"}
    when_not: "not a decompiler; not without an indexed source tree (lazy build - never pre-run); on js targets run only AFTER recovery (wakaru/webcrack unpack first - gitnexus parses normal source, not bundles); not for DEX without source (dexdc CFG / baksmali xref instead)"
    provider: gitnexus
    produces: [android:semantic-query, android:call-graph, js:semantic-query, js:call-graph]
    requires: [source_tree, gitnexus_index]
    cost_hint: {mem_gb: 1.0, time: deep}
    quality: {android:semantic-query: high, android:call-graph: high, js:semantic-query: high, js:call-graph: high}

  - name: dexdc-decompile
    category: static
    capability: android:java-source
    description: Rust DEX decompiler + taint
    tier: T1
    cost_tier: deep
    input_output: {input: "APK/DEX via tools/static/dexdc_scanner.py (PyO3 wheel dex_decompiler, CLI dex-decompile fallback; no JVM)", output: "evidence/dexdc_index.json (gitnexus-shape classes/methods/xrefs + per-method cfg) + evidence/dexdc_taint.json (IssueReport issues source->sink with traces)"}
    when_not: "not the highest-fidelity java source when jadx runs within budget (jadx stays high); its value is data-flow/string-decrypt/algorithm-verify which jadx lacks; not for dex rewrite (baksmali/dexlib2)"
    provider: dexdc
    produces: [android:java-source, android:call-graph, android:data-flow, android:string-decrypt, android:algorithm-verify]
    requires: [dex, dexdc_wheel]
    cost_hint: {mem_gb: 1.0, time: deep}
    quality: {android:java-source: mid, android:call-graph: mid, android:data-flow: high, android:string-decrypt: high, android:algorithm-verify: high}
  # #728 web (labs): direct-npx JS recovery tools. wakaru unbundles/minifies;
  # webcrack deobfuscates classic (obfuscator.io-class) layers. Agent invokes
  # via npx; not init-gated. Upstream verified: wakaru 1.10.0, webcrack 2.16.0,
  # --version confirmed 2026-08-26.
  - name: wakaru-unbundle
    category: static
    capability: js:unbundle
    tier: T1
    cost_tier: cheap
    input_output: {input: "minified/bundled JS (webpack/esbuild/Browserify/Metro/Closure/ncc), output: module-tree + transpiler/minifier undo + type annotation removal; register the output directory into evidence/<run>.json unpack_out so gitnexus-query can lazy-index it (#751)"}
    description: Unpacks bundler; reverses transpiler
    when_not: "not for obfuscator.io/string-array/control-flow-flattening/VM-protected code (wakaru deliberately avoids these); try webcrack first for classic obfuscation"
    provider: wakaru
    produces: [js:unbundle]
    requires: []
    cost_hint: {mem_gb: 0.5, time: cheap}
    quality: {js:unbundle: high}

  - name: webcrack-deobfuscate
    category: static
    capability: js:deobfuscate
    tier: T1
    cost_tier: cheap
    input_output: {input: "obfuscator.io / minified JS, output: deobfuscated source tree; register the output directory into evidence/<run>.json unpack_out so gitnexus-query can lazy-index it (#751)"}
    description: Deobfuscates classic JS layers
    when_not: "not for VM bytecode or environment-bound code; use wakaru on the output to recover module structure after deobfuscation"
    provider: webcrack
    produces: [js:deobfuscate]
    requires: []
    cost_hint: {mem_gb: 0.5, time: cheap}
    quality: {js:deobfuscate: high}

