schema: tools-index/1
purpose: >-
  Machine-readable tool index for the kunglao-agent toolshelf. Each entry is one
  tool with its capability tag, execution tier, cost tier, and input/output
  contract. Validated by tools/validate_index.py (issue #283). Human entry
  points: tools/_INDEX.md (6-category domain index) + tools/_index-<category>.md
  (per-category skeletons, progressive disclosure).

# ---- entry schema (machine contract) ---------------------------------------
#   name:         unique tool id, lowercase kebab-case (e.g. chacha-string-layer)
#   category:     one of crypto|static|ghidra|dynamic|pipeline|aux
#   capability:   "<domain>:<operation>" capability tag, e.g. crypto:decode
#   tier:         T1 static tool | T2 emulation | T3 VM-dynamic
#   cost_tier:    probe | cheap | deep
#   input_output: non-empty input->output contract (str, or {input, output})
#   when_not:     optional — when NOT to use this tool
#
#   example:
#   - name: chacha-string-layer
#     category: crypto
#     capability: crypto:decode
#     tier: T1
#     cost_tier: cheap
#     input_output: {input: 密文字节串, output: 明文层}
#     when_not: 非 ChaCha 流加密时不用
# -----------------------------------------------------------------------------

tools:
  # -- crypto: 8 算法 CLI (issue #285 吸收) --
  - name: crypto-tool
    category: crypto
    capability: crypto:decode
    tier: T1
    cost_tier: cheap
    input_output: {input: 密文字节串(--in/--in-hex) + 子命令(chacha|xor-add|rolling-xor|lzss|lzma-raw|rsa-unpad|go-byte-transform|va-to-off), output: 明文/变换后字节 + --reproduce field=value}
    when_not: 非本 8 算法族的加密方案不用; 先用 --self-check 校验环境

  # -- ghidra: 函数级静态侦察 (issue #293 吸收, sa-ghidra 定稿) --
  - name: ghidra-recon
    category: ghidra
    capability: ghidra:recon
    tier: T1
    cost_tier: deep
    input_output: {input: 样本 + --search-terms/--expected-exports/--sha256/--sha1, output: JSON(meta/imports/exports/functions/strings_of_interest/suspicious_api_calls/focus_functions/go/findings)}
    when_not: 仅需单函数反汇编时不用, 用 ghidra-decompile-functions

  - name: ghidra-decompile-functions
    category: ghidra
    capability: ghidra:decompile
    tier: T1
    cost_tier: deep
    input_output: {input: 样本 + --addresses/--strings/--window, output: JSON(per-target decompiled C + disasm window + string xrefs)}
    when_not: 批量全量反汇编不用; 需要 vtable 恢复时用 ghidra-vtable-struct

  - name: ghidra-vtable-struct
    category: ghidra
    capability: ghidra:vtable
    tier: T1
    cost_tier: cheap
    input_output: {input: 样本 + --address/--name/--class/--apply, output: JSON(vtable slot 表 + function fields, 可选落结构/标签)}
    when_not: 无明确 vtable 地址或纯文本任务不用

  - name: ghidra-evidence-annotations
    category: ghidra
    capability: ghidra:annotate
    tier: T1
    cost_tier: cheap
    input_output: {input: 样本 + --mode apply|verify + --tsv, output: JSON(annotation 应用/校验摘要, verify 失败抛错 fail-closed)}
    when_not: 无证据 TSV 需要写回/校验时不用

  - name: ghidra-scan-pointer
    category: ghidra
    capability: ghidra:xref-scan
    tier: T1
    cost_tier: deep
    input_output: {input: 样本 + --mode xref|window(--addresses/--center), output: JSON(xref/raw 8-byte 指针扫描命中)}
    when_not: 仅字符串定位不用, 用 ghidra-decompile-functions

  # -- static: 反汇编常量 byte-exact 校验 (issue #284 登记) --
  - name: disasm-constant-check
    category: static
    capability: static:disasm-check
    tier: T1
    cost_tier: cheap
    input_output: {input: fact/report 代码清单 + PE 二进制(VA 锚点断言), output: byte-exact 断言校验 JSON(ok/mismatches/errors/skipped)}
    when_not: 无需 VA 锚点常量校验或没有二进制样本时不用

  # -- pipeline: 证据索引构建 (issue #284 登记) --
  - name: build-evidence-index
    category: pipeline
    capability: pipeline:evidence-index
    tier: T1
    cost_tier: cheap
    input_output: {input: workspace 的 evidence/ + analysis_artifacts/ 原始证据, output: evidence/_index.json + _INDEX.md(eid/path/sha256/source_reliability)}
    when_not: 纯分析不做证据登记时不用

  # -- aux: legacy PROVEN 审计 (issue #284 登记) --
  - name: audit-legacy-proven
    category: aux
    capability: aux:proven-audit
    tier: T1
    cost_tier: cheap
    input_output: {input: workspace(claim-register.yaml + facts/_INDEX.md), output: legacy PROVEN claim 审计(BLIND 签名维度 + 索引溯源性)}
    when_not: 无 legacy PROVEN claim 需审计清理时不使用

  # -- aux: golden master 采集 (issue #284 登记) --
  - name: capture-golden
    category: aux
    capability: aux:golden-capture
    tier: T1
    cost_tier: cheap
    input_output: {input: 'CASES 清单(合成工作区 + CLI 参数)', output: 'tests/fixtures/golden/{manifest.yaml, F-NN/expected/stdout.txt}'}
    when_not: 仅契约变更流程用 --refresh 重采, 常规分析不用

  # -- aux: BLIND 覆盖测量 (issue #284 登记) --
  - name: measure-blind-coverage
    category: aux
    capability: aux:blind-coverage
    tier: T1
    cost_tier: cheap
    input_output: {input: workspace(claim-register.yaml + facts/*.md 的 verifier_sign_off), output: BLIND 覆盖率 JSON(PROVEN/blind_signed/unverified/coverage)}
    when_not: 无需评估盲验覆盖时不用

  # -- aux: 冷启动 token 基线测量 (issue #284 登记) --
  - name: measure-cold-start
    category: aux
    capability: aux:cold-start-metrics
    tier: T1
    cost_tier: probe
    input_output: {input: workspace 状态文件清单(claim-register.yaml/_INDEX/ledger/progress 等), output: docs/baselines/cold-start-tokens.json(逐文件 token 估算)}
    when_not: 非冷启动基线测量时不使用
