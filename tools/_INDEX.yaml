schema: tools-index/1
purpose: >-
  Machine-readable tool index for the kunglao-agent toolshelf. Each entry is one
  tool with its capability tag, execution tier, cost tier, and input/output
  contract. Validated by tools/validate_index.py (issue #283). Human entry
  points: tools/_INDEX.md (6-category domain index) + tools/_index-<category>.md
  (per-category skeletons, progressive disclosure).

# ---- entry schema (machine contract) ---------------------------------------
#   name:         unique tool id, lowercase kebab-case (e.g. chacha-string-layer)
#   category:     one of crypto|static|ghidra|dynamic|auxiliary|pipelines (== dir name, #340)
#   capability:   "<domain>:<operation>" capability tag, e.g. crypto:decode
#   tier:         T1 static tool | T2 emulation | T3 VM-dynamic
#   cost_tier:    probe | cheap | deep
#   input_output: non-empty input->output contract (str, or {input, output})
#   when_not:     optional — when NOT to use this tool
#
#   example:
#   - name: chacha-string-layer
#     category: crypto
#     capability: crypto:decode
#     tier: T1
#     cost_tier: cheap
#     input_output: {input: 密文字节串, output: 明文层}
#     when_not: 非 ChaCha 流加密时不用
# -----------------------------------------------------------------------------

tools:
  # -- crypto: 8 算法 CLI (issue #285 吸收) --
  - name: crypto-tool
    category: crypto
    capability: crypto:decode
    tier: T1
    cost_tier: cheap
    input_output: {input: 密文字节串(--in/--in-hex) + 子命令(chacha|xor-add|rolling-xor|lzss|lzma-raw|rsa-unpad|go-byte-transform|va-to-off), output: 明文/变换后字节 + --reproduce field=value}
    when_not: 非本 8 算法族的加密方案不用; 先用 --self-check 校验环境

  # -- ghidra: 函数级静态侦察 (issue #293 吸收, sa-ghidra 定稿) --
  - name: ghidra-recon
    category: ghidra
    capability: ghidra:recon
    tier: T1
    cost_tier: deep
    input_output: {input: 样本 + --search-terms/--expected-exports/--sha256/--sha1, output: JSON(meta/imports/exports/functions/strings_of_interest/suspicious_api_calls/focus_functions/go/findings)}
    when_not: 仅需单函数反汇编时不用, 用 ghidra-decompile-functions

  - name: ghidra-decompile-functions
    category: ghidra
    capability: ghidra:decompile
    tier: T1
    cost_tier: deep
    input_output: {input: 样本 + --addresses/--strings/--window/--context, output: JSON(per-target decompiled C + disasm window + string xrefs; --context 增 caller/callee ~10 行片段 + xref 串 + 已恢复命名, ghidra_context.v1)}
    when_not: 批量全量反汇编不用; 需要 vtable 恢复时用 ghidra-vtable-struct

  - name: ghidra-vtable-struct
    category: ghidra
    capability: ghidra:vtable
    tier: T1
    cost_tier: cheap
    input_output: {input: 样本 + --address/--name/--class/--apply, output: JSON(vtable slot 表 + function fields, 可选落结构/标签)}
    when_not: 无明确 vtable 地址或纯文本任务不用

  - name: ghidra-evidence-annotations
    category: ghidra
    capability: ghidra:annotate
    tier: T1
    cost_tier: cheap
    input_output: {input: 样本 + --mode apply|verify + --tsv, output: JSON(annotation 应用/校验摘要, verify 失败抛错 fail-closed)}
    when_not: 无证据 TSV 需要写回/校验时不用

  - name: ghidra-scan-pointer
    category: ghidra
    capability: ghidra:xref-scan
    tier: T1
    cost_tier: deep
    input_output: {input: 样本 + --mode xref|window(--addresses/--center), output: JSON(xref/raw 8-byte 指针扫描命中)}
    when_not: 仅字符串定位不用, 用 ghidra-decompile-functions

  # -- static: 反汇编常量 byte-exact 校验 (issue #284 登记) --
  - name: disasm-constant-check
    category: static
    capability: static:disasm-check
    tier: T1
    cost_tier: cheap
    input_output: {input: fact/report 代码清单 + PE 二进制(VA 锚点断言), output: byte-exact 断言校验 JSON(ok/mismatches/errors/skipped)}
    when_not: 无需 VA 锚点常量校验或没有二进制样本时不用

  # -- static: YARA 规则扫描/生成 (issue #313, 吸收 findcrypt-yara rules 资产) --
  - name: yara-scan
    category: static
    capability: static:yara-scan
    tier: T1
    cost_tier: cheap
    input_output: {input: 二进制(--binary) + 规则文件/目录(--rules, 默认内置 crypto-tables), output: 命中清单(offset/rule/len/preview) + --json/--reproduce}
    when_not: 无规则式扫描需求时不用; yara-python 缺失时 exit 2 带安装指引

  - name: yara-gen
    category: static
    capability: static:yara-gen
    tier: T1
    cost_tier: probe
    input_output: {input: 特征模式(--hex 或 --string) + --name + --meta k=v, output: YARA 规则文本(stdout)}
    when_not: 不需要从分析发现生成检测规则时不用

  # -- static: 6 个零依赖静态 CLI (issue #278 PR-1b 吸收) --
  - name: extract-syscalls
    category: static
    capability: static:syscall-extract
    tier: T1
    cost_tier: cheap
    input_output: {input: 样本字节(--mode bin)或反汇编文本(--mode text), output: syscall stub 清单(location/number/name) + --reproduce field=value}
    when_not: 非 x64 syscall stub 扫描任务时不用

  - name: stack-strings
    category: static
    capability: static:stack-strings
    tier: T1
    cost_tier: cheap
    input_output: {input: 样本字节 + --start/--end/--min-len/--dword, output: "[rsp+disp] 栈构造字符串清单(slot/value/writes)"}
    when_not: 无 mov byte/dword [rsp+disp] 栈写入模式时不用

  - name: binary-sweep
    category: static
    capability: static:byte-sweep
    tier: T1
    cost_tier: cheap
    input_output: {input: 样本字节 + --kind url|ipv4|domain|all 或 --pattern 自定义字节正则, output: 字节级模式命中清单(kind/offset/value)}
    when_not: 需要 PE 节表感知的结构化字符串提取时不用, 用 die/floss 流程

  - name: strings-classify
    category: static
    capability: static:strings-classify
    tier: T1
    cost_tier: cheap
    input_output: {input: 样本字节 + --min-len/--encoding ascii|utf16le|both, output: 字符串分类清单(entropy/printable_ratio/base64/hex) + inventory 统计}
    when_not: 已用 floss 全量提取且无需熵/可解码分类时不用

  - name: go-buildinfo-carve
    category: static
    capability: static:buildinfo-carve
    tier: T1
    cost_tier: cheap
    input_output: {input: 样本字节 + --window/--zero-run, output: Go buildinfo blob 清单(offset/go_version/path/mod_count/dep_count/size)}
    when_not: 非 Go 样本时不用(先 die 确认语言)

  - name: call-site-args
    category: static
    capability: static:callsite-args
    tier: T1
    cost_tier: cheap
    input_output: {input: 反汇编文本 + --window/--abi x64|x86, output: 调用点参数清单(address/target/regs/stack/pushed)}
    when_not: 需要寄存器级数据流精确恢复时不用, 用 ghidra-recon 或模拟执行
  - name: pe-analyze
    category: static
    capability: static:pe-parse
    tier: T1
    cost_tier: cheap
    input_output: {input: 样本 PE(--binary) + 子命令(headers|sections|imports|exports|resources|overlay|pdb|tls|signature|all), output: 对应 PE 表/数据 JSON + --reproduce field=value}
    when_not: 需要指令级反汇编或函数级视图时不用, 用 disasm-dump / ghidra-recon

  - name: overlay-scan
    category: static
    capability: static:overlay-scan
    tier: T1
    cost_tier: cheap
    input_output: {input: 样本 PE(--binary) + --mode reloc|true|mz|all, output: 覆盖区表征 JSON(reloc 表/熵/Go 证据/内嵌 PE 命中)}
    when_not: 无 PE 覆盖区(overlay)或无内嵌载荷怀疑时不用

  - name: disasm-dump
    category: static
    capability: static:disasm
    tier: T1
    cost_tier: cheap
    input_output: {input: 样本 PE(--binary) + --rvas/--vas 列表 + 可选 --prologs/--strings, output: 每址 capstone 指令清单 JSON(VA→文件偏移复用 tools/_lib/lib_disasm.py)}
    when_not: 需要函数级语义/反编译时不用, 用 ghidra-recon / ghidra-decompile-functions

  - name: shellcode-scan
    category: static
    capability: static:shellcode-scan
    tier: T1
    cost_tier: cheap
    input_output: {input: 二进制 blob/PE(--binary) + --scan/--entry/--prologs/--peb/--strings, output: shellcode 候选区域 + 特征 JSON(PEB 访问/序言/字符串/入口反汇编)}
    when_not: 非 shellcode/blob 检测任务不用

  - name: die-probe
    category: static
    capability: static:identify
    tier: T1
    cost_tier: probe
    input_output: {input: 样本 PE(--binary) + DIE 可执行文件(--die/$KUNGLAO_DIE), output: DIE 5-call merge JSON(语言/编译器/加壳/熵/资源); die 缺失 exit 2 + 安装指引}
    when_not: DIE 未安装且不允许安装时不用

  # -- static: 反编译 C 后处理 (issue #306 吸收, C 文本层) --
  - name: c-normalize
    category: static
    capability: static:decompile-normalize
    tier: T1
    cost_tier: cheap
    input_output: {input: 反编译 C 文本(--in 或 stdin) + --heuristics, output: 规范化 C(modulo 惯用法 x-(x/N)*N→x%N / 死赋值删除; --heuristics 开 undefined4/8 类型启发) + rule_hits/diff stats; exit 0 变换/1 无变换/2 错误}
    when_not: 语义级反混淆或表达式真值判定不用, 用 opaque-pred

  - name: opaque-pred
    category: static
    capability: static:opaque-predicate
    tier: T1
    cost_tier: probe
    input_output: {input: C 表达式(--expr "...")或表达式对(--simplify "lhs -> rhs"), output: always_true/always_false/unknown + 简化常量 或 MBA 重写建议(z3 32-bit 语义); z3 缺失 exit 2 + 安装指引}
    when_not: 非单表达式真值/MBA 等价判定不用; z3-solver 未装且不允许安装时不用

  # -- pipeline: 证据索引构建 (issue #284 登记) --
  - name: build-evidence-index
    category: pipelines
    capability: pipeline:evidence-index
    tier: T1
    cost_tier: cheap
    input_output: {input: workspace 的 evidence/ + analysis_artifacts/ 原始证据, output: evidence/_index.json + _INDEX.md(eid/path/sha256/source_reliability)}
    when_not: 纯分析不做证据登记时不用

  # -- aux: legacy PROVEN 审计 (issue #284 登记) --
  - name: audit-legacy-proven
    category: auxiliary
    capability: aux:proven-audit
    tier: T1
    cost_tier: cheap
    input_output: {input: workspace(claim-register.yaml + facts/_INDEX.md), output: legacy PROVEN claim 审计(BLIND 签名维度 + 索引溯源性)}
    when_not: 无 legacy PROVEN claim 需审计清理时不使用

  # -- aux: golden master 采集 (issue #284 登记) --
  - name: capture-golden
    category: auxiliary
    capability: aux:golden-capture
    tier: T1
    cost_tier: cheap
    input_output: {input: 'CASES 清单(合成工作区 + CLI 参数)', output: 'tests/fixtures/golden/{manifest.yaml, F-NN/expected/stdout.txt}'}
    when_not: 仅契约变更流程用 --refresh 重采, 常规分析不用

  # -- aux: BLIND 覆盖测量 (issue #284 登记) --
  - name: measure-blind-coverage
    category: auxiliary
    capability: aux:blind-coverage
    tier: T1
    cost_tier: cheap
    input_output: {input: workspace(claim-register.yaml + facts/*.md 的 verifier_sign_off), output: BLIND 覆盖率 JSON(PROVEN/blind_signed/unverified/coverage)}
    when_not: 无需评估盲验覆盖时不用

  # -- aux: 冷启动 token 基线测量 (issue #284 登记) --
  - name: measure-cold-start
    category: auxiliary
    capability: aux:cold-start-metrics
    tier: T1
    cost_tier: probe
    input_output: {input: workspace 状态文件清单(claim-register.yaml/_INDEX/ledger/progress 等), output: docs/baselines/cold-start-tokens.json(逐文件 token 估算)}
    when_not: 非冷启动基线测量时不使用

  # -- aux: 样本内容 prompt 注入 sanitize (issue #307 登记) --
  - name: sanitize-text
    category: auxiliary
    capability: aux:sanitize
    tier: T1
    cost_tier: probe
    input_output: {input: 样本派生文本(--in/标准输入) + --mode zero-width|homoglyph|markers|full + --report-only, output: 净化文本或 JSON(zwx_count/homoglyph_count/marker_count/suspicious/sha256) + --reproduce field=value}
    when_not: 文本不经 LLM worker 消费时不使用
