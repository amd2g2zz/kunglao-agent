<svg xmlns="http://www.w3.org/2000/svg" width="960" height="720" viewBox="0 0 960 720" font-family="'SF Mono','Menlo','Cascadia Code',monospace"><rect width="960" height="720" rx="12" fill="#11131a"/><rect width="960" height="36" rx="12" fill="#232839"/><circle cx="22" cy="18" r="6" fill="#ff5f57"/><circle cx="42" cy="18" r="6" fill="#febc2e"/><circle cx="62" cy="18" r="6" fill="#28c840"/><text x="480" y="23" font-size="13" fill="#8b93a7" text-anchor="middle">how four approaches decide</text><rect x="24" y="52" width="912" height="140" rx="8" fill="#181b26" stroke="#2a2f45"/><text x="40" y="78" font-size="13" fill="#a9b1d6">Static knowledge routing</text><text x="920" y="78" font-size="11" fill="#565f89" text-anchor="end">open chain, no feedback</text><rect x="48" y="100" width="170" height="40" rx="6" fill="#181b26" stroke="#2a2f45"/><text x="133.0" y="124.0" font-size="12" fill="#c0caf5" text-anchor="middle">methodology manual</text><line x1="222" y1="120" x2="263" y2="120" stroke="#565f89" stroke-width="2"/><polygon points="264,116 264,124 271,120" fill="#565f89"/><rect x="268" y="100" width="170" height="40" rx="6" fill="#181b26" stroke="#2a2f45"/><text x="353.0" y="124.0" font-size="12" fill="#c0caf5" text-anchor="middle">LLM improvises</text><line x1="442" y1="120" x2="483" y2="120" stroke="#565f89" stroke-width="2"/><polygon points="484,116 484,124 491,120" fill="#565f89"/><rect x="488" y="100" width="130" height="40" rx="6" fill="#181b26" stroke="#2a2f45"/><text x="553.0" y="124.0" font-size="12" fill="#c0caf5" text-anchor="middle">output</text><rect x="24" y="200" width="912" height="140" rx="8" fill="#181b26" stroke="#2a2f45"/><text x="40" y="226" font-size="13" fill="#a9b1d6">Bounded pipeline</text><text x="920" y="226" font-size="11" fill="#565f89" text-anchor="end">rounds capped by design</text><rect x="48" y="248" width="140" height="40" rx="6" fill="#181b26" stroke="#2a2f45"/><text x="118.0" y="272.0" font-size="12" fill="#c0caf5" text-anchor="middle">fixed stages</text><line x1="192" y1="268" x2="229" y2="268" stroke="#565f89" stroke-width="2"/><polygon points="230,264 230,272 237,268" fill="#565f89"/><rect x="234" y="248" width="140" height="40" rx="6" fill="#181b26" stroke="#2a2f45"/><text x="304.0" y="272.0" font-size="12" fill="#c0caf5" text-anchor="middle">fixed gates</text><line x1="378" y1="268" x2="415" y2="268" stroke="#565f89" stroke-width="2"/><polygon points="416,264 416,272 423,268" fill="#565f89"/><rect x="420" y="248" width="160" height="40" rx="6" fill="#181b26" stroke="#2a2f45"/><text x="500.0" y="272.0" font-size="12" fill="#c0caf5" text-anchor="middle">bounded rounds</text><line x1="584" y1="268" x2="621" y2="268" stroke="#565f89" stroke-width="2"/><polygon points="622,264 622,272 629,268" fill="#565f89"/><rect x="626" y="248" width="120" height="40" rx="6" fill="#181b26" stroke="#2a2f45"/><text x="686.0" y="272.0" font-size="12" fill="#c0caf5" text-anchor="middle">output</text><path d="M 686 284 L 686 302 L 490 302 L 490 290" fill="none" stroke="#565f89" stroke-width="2"/><polygon points="486,291 494,291 490,283" fill="#565f89"/><text x="588.0" y="316" font-size="11" fill="#565f89" text-anchor="middle">loop is fixed, learns nothing</text><rect x="24" y="348" width="912" height="140" rx="8" fill="#181b26" stroke="#2a2f45"/><text x="40" y="374" font-size="13" fill="#a9b1d6">Single-verdict triage</text><text x="920" y="374" font-size="11" fill="#565f89" text-anchor="end">narrow domain, one pass</text><rect x="48" y="396" width="130" height="40" rx="6" fill="#181b26" stroke="#2a2f45"/><text x="113.0" y="420.0" font-size="12" fill="#c0caf5" text-anchor="middle">target</text><line x1="182" y1="416" x2="215" y2="416" stroke="#565f89" stroke-width="2"/><polygon points="216,412 216,420 223,416" fill="#565f89"/><rect x="220" y="396" width="150" height="40" rx="6" fill="#181b26" stroke="#2a2f45"/><text x="295.0" y="420.0" font-size="12" fill="#c0caf5" text-anchor="middle">agent loop</text><line x1="374" y1="416" x2="407" y2="416" stroke="#565f89" stroke-width="2"/><polygon points="408,412 408,420 415,416" fill="#565f89"/><rect x="412" y="396" width="130" height="40" rx="6" fill="#181b26" stroke="#2a2f45"/><text x="477.0" y="420.0" font-size="12" fill="#c0caf5" text-anchor="middle">verdict</text><text x="580" y="421" font-size="11" fill="#565f89">nothing banks between runs</text><rect x="24" y="496" width="912" height="140" rx="8" fill="#181b26" stroke="#2a2f45"/><text x="40" y="522" font-size="13" fill="#9ece6a">kunglao-agent (act-level RL controller)</text><text x="920" y="522" font-size="11" fill="#9ece6a" text-anchor="end">the loop measures itself</text><rect x="48" y="540" width="90" height="36" rx="6" fill="#181b26" stroke="#2a2f45"/><text x="93.0" y="562.0" font-size="12" fill="#c0caf5" text-anchor="middle">task</text><line x1="142" y1="558" x2="175" y2="558" stroke="#565f89" stroke-width="2"/><polygon points="176,554 176,562 183,558" fill="#565f89"/><rect x="180" y="540" width="170" height="36" rx="6" fill="#181b26" stroke="#2a2f45"/><text x="265.0" y="562.0" font-size="12" fill="#c0caf5" text-anchor="middle">oracle derivation</text><line x1="354" y1="558" x2="387" y2="558" stroke="#565f89" stroke-width="2"/><polygon points="388,554 388,562 395,558" fill="#565f89"/><rect x="392" y="540" width="120" height="36" rx="6" fill="#181b26" stroke="#7aa2f7"/><text x="452.0" y="562.0" font-size="12" fill="#c0caf5" text-anchor="middle">act loop</text><line x1="516" y1="558" x2="549" y2="558" stroke="#565f89" stroke-width="2"/><polygon points="550,554 550,562 557,558" fill="#565f89"/><rect x="554" y="540" width="110" height="36" rx="6" fill="#181b26" stroke="#2a2f45"/><text x="609.0" y="562.0" font-size="12" fill="#c0caf5" text-anchor="middle">ledger</text><line x1="668" y1="558" x2="701" y2="558" stroke="#565f89" stroke-width="2"/><polygon points="702,554 702,562 709,558" fill="#565f89"/><rect x="706" y="540" width="180" height="36" rx="6" fill="#181b26" stroke="#7aa2f7"/><text x="796.0" y="562.0" font-size="12" fill="#c0caf5" text-anchor="middle">posterior update</text><path d="M 796 574 L 796 592 L 452 592 L 452 580" fill="none" stroke="#9ece6a" stroke-width="3"/><polygon points="448,581 456,581 452,573" fill="#9ece6a"/><text x="624.0" y="606" font-size="11" fill="#e0af68" text-anchor="middle">policy updates from its own measured history</text><text x="480" y="706" font-size="13" fill="#c0caf5" text-anchor="middle">The first three decide with fixed logic; the fourth learns its control law.</text></svg>