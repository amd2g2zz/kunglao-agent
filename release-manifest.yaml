# release-manifest.yaml — kunglao-agent release contract (issue #80)

# The DECLARED release inventory. Every path here SHALL exist in the tree;
# scripts/release_receipt.py validates this and records sha256 digests.
# Adding a shipped asset without declaring it here fails `--check` on purpose.

schema_version: "1.0"
project: kunglao-agent
version: "0.1.3"             # MUST equal pyproject.toml [project].version (receipt-checked)
requires_python: ">=3.10"

dependencies:
  # Runtime deps actually imported by the codebase (see pyproject.toml).
  - PyYAML
  - pefile
  - capstone
  - jsonschema

assets:
  agents:
    - agents/kunglao-worker.md
    - agents/kunglao-redteam.md
    - agents/ghidra-light.md
    - agents/floss-filter.md
    - agents/pefile-signature.md
    - agents/go-symbols.md
    - agents/verdict-scorer.md
    - agents/kunglao-init-worker.md   # #304 init worker agent
  hooks:
    - hooks/completion_gate.py
    - hooks/dispatch_gate.py
    - hooks/env_check_gate.py
    - hooks/heartbeat_touch.py
    - hooks/lib_kunglao.py
    - hooks/recall_inject.py   # #268 wired by wire_up_settings.py:152
    - hooks/session_start.py   # #533 SessionStart lifecycle (always_arm)
    - hooks/state_anchor.py
    - hooks/worker_budget.py
    - hooks/worker_budget_core.py   # #568 split: budget core
    - hooks/worker_budget_gates.py  # #568 split: gates consumer
    - hooks/worker_budget_sinks.py  # #568 split: sinks persistence
    - hooks/worker_pulse.py
    - hooks/write_guard.py     # #532 four-carrier Write/Edit PreToolUse gate
    - hooks/orchestrator_tool_guard.py  # #608 Bash maker-checker WARN (target-based)
    - hooks/_path_hygiene.py  # #671 sys.path membership authority (sole bare-insert whitelist)
    - hooks/violation_capture.py      # #718 Bash PostToolUse violation recorder
  templates:
    - templates/state/blocker.md
    - templates/state/claim_deps.yaml
    - templates/state/claim-register.yaml
    - templates/state/task-oracle.yaml
    - templates/state/task_spec.yaml
    # #356 W2: single-source workspace CLAUDE.md template (OS delta injected
    # by kunglao-init at render; replaces the 4 pre-#356 variant templates)
    - templates/CLAUDE.md.base.tmpl
    # #336: ICD-203 fact frontmatter template (merged after #320 snapshot)
    - templates/fact-frontmatter.md
    # #335/#278: frida + scripts templates (template_gen.py inputs)
    - templates/frida/cfg-analyze.py.tmpl
    - templates/frida/cfg-hook.js.tmpl
    - templates/scripts/decryption-analysis.py.tmpl
    - templates/scripts/disasm-pipeline.py.tmpl
    - templates/scripts/stage-unpack.py.tmpl
  tools:
    # #320: full toolshelf declaration (reverse scan contract). Doc/index-class
    # files (README.md, _INDEX.yaml, _INDEX.md, _index-*.md) are exempt — they
    # are governed by tools/_INDEX.yaml + validate_index.py, not this manifest.
    - tools/auxiliary/audit_legacy_proven.py
    - tools/auxiliary/sanitize.py
    - tools/pipelines/build_evidence_index.py
    - tools/auxiliary/capture_golden.py
    - tools/crypto/__init__.py
    - tools/crypto/algorithms.py
    - tools/crypto/crypto-tool.py
    - tools/static/disasm_constant_check.py
    - tools/ghidra/DecompileFunctions.java
    # #308: Ghidra async job protocol + binary diff (merged after #320 snapshot)
    - tools/ghidra/GhidraBindiff.java
    - tools/ghidra/ghidra_diff.py
    - tools/ghidra/ghidra_job.py
    - tools/ghidra/job_store.py
    - tools/ghidra/GhidraEvidenceAnnotations.java
    - tools/ghidra/GhidraExportVtableStruct.java
    - tools/ghidra/GhidraJsonScript.java
    - tools/ghidra/GhidraRecon.java
    - tools/ghidra/GhidraScanPointer.java
    - tools/ghidra/run_ghidra_postscript.py
    - tools/_lib/lib_disasm.py
    # #538: shared facts/_INDEX schema+parser (update_index + digest_build)
    - tools/_lib/index_schema.py
    # #538: workspace carrier manifest writer (resume #466 diff source)
    - tools/_lib/workspace_manifest.py
    - tools/auxiliary/measure_blind_coverage.py
    - tools/auxiliary/measure_cold_start.py
    # #670: memory-gated jadx dispatch estimator (APK/JAR) + DEX xref
    - tools/static/apk_mem_gate.py
    - tools/static/baksmali_index.py
    - tools/static/dexdc_scanner.py   # #692 WP2 dexdc provider
    - tools/static/binary-sweep.py
    - tools/static/c_normalize.py
    - tools/static/call-site-args.py
    - tools/static/common.py
    - tools/static/die_probe.py
    - tools/static/disasm_dump.py
    - tools/static/extract-syscalls.py
    - tools/static/go-buildinfo-carve.py
    - tools/static/opaque_pred.py
    - tools/static/overlay_scan.py
    - tools/static/pe_analyze.py
    - tools/static/rust-dep-strings.py
    - tools/static/shellcode_scan.py
    - tools/static/stack-strings.py
    - tools/static/strings-classify.py
    - tools/static/yara-gen.py
    - tools/static/yara-rules/crypto-tables.yar
    - tools/static/yara-rules/LICENSE.findcrypt-yara
    - tools/static/yara-scan.py
    - tools/tool-search.py
    - tools/validate_index.py
    # #476: ext catalog — describe-only capability index (generated by
    # ext-scan.py; committed so the reverse scan enforces its presence)
    - tools/ext-scan.py
    - tools/_INDEX.ext.yaml
    - tools/_INDEX.ext.map.yaml
  knowledge:
    # #147 / report §4.5.4: a run must bind to the exact knowledge-base
    # revision. The main skill (skills/kunglao-agent/SKILL.md) + the per-command
    # skills + references/ digests land in the receipt.
    - skills/kunglao-agent/SKILL.md
    # #537 F-C4: global-rule distillation bundled with the skill package
    # (external installs read this copy; repo-top rules/ is the source).
    - skills/kunglao-agent/rules/kunglao-convergence-loop.md
    - skills/init/SKILL.md
    - skills/analysis/SKILL.md
    - skills/help/SKILL.md
    - SKILL.md  # root command-router (skill-dir install entry point, #413)
    # #366: metadata-only plugin manifest — version 0.1 must be visible
    # to the plugin manager; identity fields only, no component wiring (#364).
    - .claude-plugin/plugin.json
    # #352: marketplace catalog — v0.1 ships it; users add the marketplace
    # via `/plugin marketplace add amd2g2zz/kunglao-agent` and install the
    # single listed plugin (schema: code.claude.com plugin-marketplaces).
    - .claude-plugin/marketplace.json
  references:
    # Directory entry is digested via sha256_dir by release_receipt.
    - references/

clis:
  # The 9 independent CLIs (tests/test_cli_matrix.py) — each must answer --help with exit 0.
  - scripts/kunglao.py
  - scripts/kunglao-decide.py
  - scripts/kunglao-verify.py
  - scripts/kunglao-record.py
  - scripts/kunglao-monitor.py
  - scripts/kunglao-init.py
  - scripts/kunglao-eval.py
  - scripts/kunglao-digest.py
  # #316: MCP supply probe (per-type manifest + ~/.claude.json + .mcp.json probe)
  - scripts/mcp_probe.py

router_subcommands:
  # kunglao.py unified entry point surface (each must answer --help with exit 0).
  - decide
  - tick
  - verify
  - record
  - health

test_command: "python -m pytest -q"   # the standard test command (pytest.ini testpaths = tests)
