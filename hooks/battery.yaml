# battery.yaml — the hook battery's registration face (issue #805)
#
# THE single declaration source for the HOOK battery: the dispatch
# pre_check checks (battery: dispatch) and the round-closure kernel
# faces (battery: closure). mechanisms.yaml's law (不入册不许跑, #878)
# extends here with the #805 prerequisites — registration FAILS CLOSED
# on any of:
#   entry               module:function — must RESOLVE to real code
#                       (AST check; an unwired face is unregistrable)
#   trigger.gate        always | dispatch | verifier_exempt
#   cost_class          cheap | medium | expensive
#   telemetry_word      the face's observable — an EMIT_ACTIONS word,
#                       a worker_budget.<name> gate-telemetry face, or
#                       file:<workspace-relative path>
#   liveness_fingerprint  an id in devkit/liveness_fingerprints.json —
#                       a face with no declared fingerprint CANNOT
#                       register (the #805 fail-closed pin)
#
# Runtime: registration is a LAUNCH PREREQUISITE. The dispatch battery's
# launch gate REJECTS on a broken/uncovered registry; a full pass lands
# ONE durable row (runs/gate-telemetry.jsonl, gate=worker_battery,
# msg=check names) — the liveness evidence the per-check fingerprints
# read (absence of evidence = FAIL). The closure battery's launch gate
# warns only (its fail-open double cage is contractual).

schema: kunglao.hook-battery/1

batteries: [dispatch, closure]
cost_classes: [cheap, medium, expensive]
gates: [always, dispatch, verifier_exempt]

entries:
