# goal-operationalization.yaml — Phase-0 goal operationalization pre-registration (#128).
# The orchestrator fills the five lists FROM the verbatim task — task-oracle.yaml
# keeps the original, this file is only the derivative — and the validator checks
# the file mechanically; there is NO user confirmation round: work proceeds, and
# the timestamped pre-registration + the delivery restatement are the human's
# audit points (skills/kunglao-agent/SKILL.md, "Goal operationalization
# pre-registration"). Consumed by scripts/goal_operationalization.py.
schema: goal-operationalization/1
verbatim_ref: "task-oracle.yaml"  # where the verbatim task lives — pointer, not payload
declared_ts: ""        # pre-registration timestamp — set when the lists are filled;
                       # a translation without one is not a record (validator refuses)
generalization: unknown  # required | not-applicable | unknown — ONE structural question:
                         # must the deliverable work on inputs beyond the captured /
                         # observed evidence? unknown is fail-closed (= required);
                         # not-applicable must also be declared as a diff_vs_verbatim
                         # entry (declaring non-generalization IS a visible narrowing)
deliverables: []       # - what counts as delivered (concrete artifacts / capabilities)
acceptance: []         # - how each deliverable is checked, mechanically where possible
not_done: []           # - counterexamples, "X does not count as done" — the immutable
                       #   constitution: append-only after the first dispatch
diff_vs_verbatim: []   # - declared delta vs the verbatim task; no silent equivalence
probe_cases: []        # - must include the fresh-input case whenever generalization is
                       #   required/unknown — for protocol client simulation the
                       #   fresh-input case IS the master oracle (generate valid output
                       #   for never-captured inputs); replay of captured pairs is the
                       #   verification ladder, never the closure
oracle_behavior_acknowledged: false  # optional: the oracle behavior statement (red is
                                     # information; machine-judged acceptance) was read
first_dispatch_ts: ""  # stamped by --stamp-dispatch at the first dispatch; from then on
                       # the lists are append-only against the frozen constitution below
constitution:          # frozen pre-dispatch copy (--stamp-dispatch writes it): the
  deliverables: []     #   validator refuses post-dispatch withdrawal of these entries
  acceptance: []       #   or a generalization flip; every other drift becomes a re-scope
  not_done: []         #   record that the delivery receipt must restate
  generalization: ""
