# task_spec.yaml — kunglao-agent input contract (Phase 0.4 fills this).
# See DESIGN §2. The user's requirements drive the orchestrator's value function.

# lane — the analysis MATERIAL contract. The runtime runs one lane per
# workspace; the lane decides whether a binary sample under bins/<sha> is
# REQUIRED and which toolchain gate applies (issue 208). Values:
#   malware     a binary sample under bins/<sha> (sha256-anchored;
#               RC_NO_SAMPLE when bins/ is empty; MCP/RE toolchain gate)
#   algorithm   reference corpora + trace dumps — no binary sample
#   protocol    source dump or live capture (pcaps / frame samples)
#   web         target URL + auth model
#   data        dataset path + format
#   app         package file with a declared contract surface
# Blank/absent: init keeps the pre-lane malware behavior when a contract
# or a sample exists, and ASKS through the exit-8 pending channel (no
# default) when the workspace declares nothing at all.
lane: ""                     # malware | algorithm | protocol | web | data | app

# Oracle anchors — REQUIRED. The init interview collects all three after
# the needs-first questions; while any is blank, analysis entry refuses
# (`kunglao analysis`, exit 7). For help turning a folk ask into these
# answers, see the README section "How to state the task".
goal_verbatim: ""            # the user's goal, VERBATIM — never paraphrased
success_criterion: ""        # what counts as done (the completion anchor)
verification_method: ""      # reproduction | replay-evidence | static | manual
                             #   reproduction / replay-evidence arm the
                             #   controlled-comparison oracle for every
                             #   primary question (byte-matched pairs
                             #   required); static / manual do not

primary_questions:            # MUST answer — convergence hard conditions C0/C0b
  # Example shape (malware lane — replace it): a yes/no question with an
  # evidence basis. Non-malware lanes phrase the same field for their
  # material (e.g. "which state machine drives the rolling key?").
  - id: q1
    q: "<the question, e.g. does the sample belong to the Vidar family?>"
    need: yes_no_with_evidence   # yes_no_with_evidence | protocol_description | model_selection
    candidates: []               # only for need: model_selection — list of competing hypotheses

  # example model_selection question (v1.7 competing hypotheses):
  # - id: q3
  #   q: "sample family attribution?"
  #   need: model_selection
  #   candidates: [vidar, wingo, gsb, loader_stub]

scope:                         # filter for which claims enter the queue
  in: []                        # e.g. [family_attribution, network, persistence]
  out: []                       # e.g. [anti_analysis_strings, bitcoin_clipper]

constraints:                   # workers must never break these — enforced by §11 PreToolUse hooks
  vm_detonation: forbidden      # forbidden | allowed — vmr-shell requires allowed
  time_budget_minutes: 120      # Phase 0.4 computes deadline_ts = now + this value
  dynamic_re: allowed           # allowed | forbidden — master switch for emulation/Frida

depth: standard                # triage | standard | deep

success_criteria:
  deliverable: fact_base        # currently fact_base only
  must_include_ioc_table: false
  confidence_floor: 倾向于       # confidence_zh enum (functional, lint_facts vocabulary): 可确认 | 表明 | 倾向于 | 可关联 | 不支持

calibration:
  # #147: every delivered claim MUST carry confidence + falsifier.
  # The delivery gate (completion transaction) treats a claim without
  # these fields as incomplete.
  require_confidence: true
  require_falsifier: true
  confidence_scale: 0-1    # 0.3 = hypothesis floor; >=0.7 = direct-use
