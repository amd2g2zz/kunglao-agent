# skills/subcommands.yaml — THE single source for the subcommand UX surface.
# One record per subcommand; the root SKILL.md menu, each subcommand SKILL.md
# frontmatter argument-hint, and the README Subcommands table are render
# surfaces linted against this file by tests/test_subcommand_zeroarg_ux.py.
# Do not hand-edit a render surface without editing this file first — a
# drifting mirror is exactly the defect class this registry replaces.
subcommands:
  init:
    invocation: "/kunglao-agent:init <workspace> [--type windows|linux|android|web|macos] [--lane malware|algorithm|protocol|web|data|app]"
    argument-hint: "<workspace> [--type windows|linux|android|web|macos] [--lane malware|algorithm|protocol|web|data|app] — no args → guided setup"
    zero-args: "guided setup prompt — workspace required, never guess, never a bare argparse error"
    missing-args: "workspace without --type routes to the intake type-alignment step — never silently default"
    example: "/kunglao-agent:init ~/cases/synth-dropper --type windows"
    next-step: "uninitialized workspace → /kunglao-agent:init"
  analysis:
    invocation: "/kunglao-agent:analysis <workspace>"
    argument-hint: "<workspace> (alias analyze) — no args → guided workspace prompt"
    zero-args: "guided workspace prompt — cwd candidate only with explicit confirm, never guess"
    missing-args: "single positional — a missing workspace is the zero-args case"
    example: "/kunglao-agent:analysis ~/cases/synth-dropper"
    next-step: "initialized workspace → /kunglao-agent:analysis"
  resume:
    invocation: "/kunglao-agent:resume <workspace>"
    argument-hint: "<workspace> — no args → guided workspace prompt"
    zero-args: "guided workspace prompt — cwd candidate only with explicit confirm, never guess"
    missing-args: "single positional — a missing workspace is the zero-args case"
    example: "/kunglao-agent:resume ~/cases/synth-dropper"
    next-step: "crashed / rebooted workspace → /kunglao-agent:resume (read-only brief + re-arm advice)"
  help:
    invocation: "/kunglao-agent:help"
    argument-hint: "[no args] — print the subcommand usage list"
    zero-args: "print the subcommand usage list"
    missing-args: "takes no arguments — nothing can be missing"
    example: "/kunglao-agent:help"
    next-step: "unsure which command → /kunglao-agent:help"
  upgrade:
    invocation: "/kunglao-agent:upgrade <workspace>"
    argument-hint: "<workspace> [--dry-run] — no args → guided workspace prompt"
    zero-args: "guided workspace prompt — cwd candidate only with explicit confirm, never guess"
    missing-args: "single positional — a missing workspace is the zero-args case"
    example: "/kunglao-agent:upgrade ~/cases/synth-dropper"
    next-step: "legacy workspace behind the skill package → /kunglao-agent:upgrade"
# CLI face: the same operations behind the `kunglao` console script
# (scripts/kunglao.py, registered under [project.scripts] in pyproject.toml;
# `uv sync` in the repo root installs it). The slash-command registry above
# is the UX single source, linted by tests/test_subcommand_zeroarg_ux.py —
# this `cli:` map is its CLI-face sibling, linted by
# tests/test_entry_registration_416.py against the router's actual
# add_parser set. Fields per record: usage (console command line), summary
# (router --help wording), slash (operator slash-command face that owns the
# operation).
cli:
  decide:
    usage: "kunglao decide <workspace> [--json]"
    summary: "convergence decision (M1)"
    slash: "driven inside /kunglao-agent:analysis"
  tick:
    usage: "kunglao tick <workspace>"
    summary: "heartbeat tick chain (M5)"
    slash: "driven inside /kunglao-agent:analysis"
  verify:
    usage: "kunglao verify <workspace> <fact_id> [--json]"
    summary: "M3 VERIFY (L1 mechanical + L2 redteam)"
    slash: "driven inside /kunglao-agent:analysis"
  record:
    usage: "kunglao record <workspace> --event '<json>'"
    summary: "M4 RECORD (ledger idempotent append)"
    slash: "driven inside /kunglao-agent:analysis"
  health:
    usage: "kunglao health <workspace>"
    summary: "convergence health (M5)"
    slash: "driven inside /kunglao-agent:analysis"
  resume:
    usage: "kunglao resume <workspace> [--json]"
    summary: "crash/reboot recovery brief (read-only)"
    slash: "/kunglao-agent:resume"
  check-stale:
    usage: "kunglao check-stale <workspace> [--resolve]"
    summary: "stale-workspace gate (rc 0/5) - run before analysis/resume on a workspace whose template stamp may trail the skill"
    slash: "guards /kunglao-agent:analysis"
  upgrade:
    usage: "kunglao upgrade <workspace> [--dry-run]"
    summary: "workspace framework-scaffold migration"
    slash: "/kunglao-agent:upgrade"
  analysis:
    usage: "kunglao analysis <workspace>"
    summary: "analysis entry gate (rc 0 clear / 5 stale / 6 heartbeat verify failed)"
    slash: "/kunglao-agent:analysis"
