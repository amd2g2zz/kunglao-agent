# skills/subcommands.yaml — THE single source for the subcommand UX surface (#456).
# Design D4 (openspec/changes/issue-456-subcommand-ux/design.md): one record
# per subcommand; the root SKILL.md menu, each subcommand SKILL.md frontmatter
# argument-hint, and the README Command Reference table are render surfaces
# linted against this file by tests/test_subcommand_zeroarg_ux.py. A drifting
# mirror is exactly the #413 defect this replaces (init had a rich hint,
# analysis had a bare one; the router answered the workspace question twice).
subcommands:
  init:
    invocation: "/kunglao-agent:init <workspace> [--type windows|linux|android|web]"
    argument-hint: "<workspace> [--type windows|linux|android|web] — no args → guided setup"
    zero-args: "guided setup prompt — workspace required, never guess, never a bare argparse error"
    missing-args: "workspace without --type routes to the #455 intake type-alignment step — never silently default"
    example: "/kunglao-agent:init ~/cases/synth-dropper --type windows"
    next-step: "uninitialized workspace → /kunglao-agent:init"
  analysis:
    invocation: "/kunglao-agent:analysis <workspace>"
    argument-hint: "<workspace> (alias analyze) — no args → guided workspace prompt"
    zero-args: "guided workspace prompt — cwd candidate only with explicit confirm, never guess"
    missing-args: "single positional — a missing workspace is the zero-args case"
    example: "/kunglao-agent:analysis ~/cases/synth-dropper"
    next-step: "initialized workspace → /kunglao-agent:analysis"
  resume:
    invocation: "/kunglao-agent:resume <workspace>"
    argument-hint: "<workspace> — no args → guided workspace prompt"
    zero-args: "guided workspace prompt — cwd candidate only with explicit confirm, never guess"
    missing-args: "single positional — a missing workspace is the zero-args case"
    example: "/kunglao-agent:resume ~/cases/synth-dropper"
    next-step: "crashed / rebooted workspace → /kunglao-agent:resume (read-only brief + re-arm advice)"
  help:
    invocation: "/kunglao-agent:help"
    argument-hint: "[no args] — print the subcommand usage list"
    zero-args: "print the subcommand usage list"
    missing-args: "takes no arguments — nothing can be missing"
    example: "/kunglao-agent:help"
    next-step: "unsure which command → /kunglao-agent:help"
  upgrade:
    invocation: "/kunglao-agent:upgrade <workspace>"
    argument-hint: "<workspace> [--dry-run] — no args → guided workspace prompt"
    zero-args: "guided workspace prompt — cwd candidate only with explicit confirm, never guess"
    missing-args: "single positional — a missing workspace is the zero-args case"
    example: "/kunglao-agent:upgrade ~/cases/synth-dropper"
    next-step: "legacy workspace behind the skill package → /kunglao-agent:upgrade"
