# release-check.yml — kunglao-agent release contract gate (issue #80)
#
# Clean-environment validation of the release contract, split into four
# parallel legs so the PR gate wall time tracks the slowest leg, not the
# sum of all legs:
#   lint-hygiene   CI YAML selfcheck + manifest/CLI/structural contracts
#   docs-contract  docs/README/governance contract tests (-m docs)
#   unit-fast      pure-unit tier (-m "fast and not docs"), xdist -n auto
#   integration    everything else (-m "not fast"), xdist -n auto — the
#                  slow tier rides here on EVERY PR (stronger than a
#                  nightly), so relocation never becomes removal
#   Merge gate = all four jobs green; any red blocks (fail-loud, nothing
#   dropped from the gate chain — the tier census pins the partition).
#
# README test counts / "shipped" claims point at the receipt artifact.

name: release-check

concurrency:
  # one live run per ref — a new push cancels the superseded run instead of
  # queueing stale suites behind it (runner routing: see runner-probe)
  group: release-check-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ "dev", "master" ]
  pull_request:
    branches: [ "dev", "master" ]

env:
  # uv picks the interpreter via this env on both tiers (self-hosted
  # image python + uv-managed 3.11 on GitHub-hosted — see the
  # provisioning step; host-agnostic since the 2026-10-07 routing).
  UV_PYTHON: python3.11

# The four legs only read the repo and upload run artifacts — no write
# surface is needed (CodeQL actions/missing-workflow-permissions).
permissions:
  contents: read

jobs:
  lint-hygiene:
    # Route to runners that actually have python3.11 (kunglao-runner-py311).
    # The fleet is heterogeneous: -b / -py310 lack python3.11 and fail fast
    # with "command not found" — the python-3.11 label pins the right host.
    # always the free tier, always parallel (owner routing 2026-10-07):
    # these three legs are pure Python + uv — verified portable.
    # The integration leg is NOT (cross toolchains + eval fixtures)
    # and stays on our self-hosted slot below.
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Ensure git (baseline replay + receipt need it on gitless runners)
      run: |
        if ! command -v git >/dev/null 2>&1; then
          sudo apt-get update
          sudo apt-get install -y git
        fi
        git --version

    - name: Install uv (documented dependency manager)
      # Official installer (astral.sh). The former `pip install --user uv`
      # broke when the runner image began enforcing PEP 668
      # (externally-managed-environment) on its managed CPython — image
      # rollout hit the queue mid-flight on 2026-09-03 and every PR run
      # failed at this step with identical runner-side errors. The installer
      # lands in ~/.local/bin (already exported to $GITHUB_PATH below).
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

    - name: Provision Python 3.11 (uv-managed, host-agnostic)
      # GitHub-hosted ubuntu images no longer preinstall 3.11; uv
      # fetches its managed build when absent (self-hosted: a no-op).
      # Runs AFTER the uv install so both tiers share one path.
      run: |
        uv python install 3.11
        uv run python --version

    - name: CI YAML selfcheck (issue #147)
      run: uv run python scripts/release_check_selfcheck.py

    - name: Install dependencies (locked)
      run: uv sync --locked

    - name: Validate release manifest + CLI surface
      run: uv run python scripts/release_receipt.py --check

    - name: Check global-rule hard prohibitions subset (issue #99)
      run: uv run python scripts/check_global_rule_subset.py

    - name: Formal-content hygiene lint (scripts + tests)
      # fail-loud gate: tracker refs / narrative markers / baseline ratchet
      # over scripts/** and tests/** (constitution rule on formal content)
      run: uv run python scripts/comment_hygiene_lint.py

    - name: Manifest-vs-imports consistency gate (issue #467)
      # fail-loud gate: the repo's hard third-party import surface
      # (hooks/scripts/tools) must be covered by the repo pyproject
      # [project].dependencies — code that lands before its manifest
      # entry dies with ModuleNotFoundError under every deployed env.
      run: uv run python scripts/dep_surface_gate.py

    - name: Invocation hygiene lint (uv-run canonical form, 0.1.6 sweep)
      # fail-loud gate: bare python/python3/pip invocations in skills/**,
      # README.md and runtime .py spawn lines — the ONE legal form is
      # `uv run --project <plugin-root> python <script> ...`; baseline is
      # zero (ratchet by absence)
      run: uv run python scripts/invocation_hygiene_lint.py

    - name: Silent-except ratchet gate (issue #275)
      # fail-loud gate: no-op-body except handlers over scripts/** and
      # hooks/** — shrink-only per-file ledger (issue #275 batch 1: the
      # ledger freezes the ~199-site inventory; growth fails, cleanup
      # shrinks it in later batches)
      run: uv run python scripts/silent_except_lint.py

    - name: Formal-code marker ratchet (issue/version numbers in comments)
      run: uv run python scripts/formal_code_lint.py

    - name: Structural integrity check (issue #141)
      run: uv run python scripts/structural_check.py .

  docs-contract:
    # always the free tier, always parallel (owner routing 2026-10-07):
    # these three legs are pure Python + uv — verified portable.
    # The integration leg is NOT (cross toolchains + eval fixtures)
    # and stays on our self-hosted slot below.
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Ensure git
      run: |
        if ! command -v git >/dev/null 2>&1; then
          sudo apt-get update && sudo apt-get install -y git
        fi
        git --version

    - name: Install uv (documented dependency manager)
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

    - name: Provision Python 3.11 (uv-managed, host-agnostic)
      # GitHub-hosted ubuntu images no longer preinstall 3.11; uv
      # fetches its managed build when absent (self-hosted: a no-op).
      # Runs AFTER the uv install so both tiers share one path.
      run: |
        uv python install 3.11
        uv run python --version

    - name: Install dependencies (locked)
      run: uv sync --locked

    - name: Docs / governance contract tier
      run: uv run python -m pytest -m docs -n auto --dist loadgroup -q --junitxml=.pytest-docs.xml

  unit-fast:
    # always the free tier, always parallel (owner routing 2026-10-07):
    # these three legs are pure Python + uv — verified portable.
    # The integration leg is NOT (cross toolchains + eval fixtures)
    # and stays on our self-hosted slot below.
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Ensure git
      run: |
        if ! command -v git >/dev/null 2>&1; then
          sudo apt-get update && sudo apt-get install -y git
        fi
        git --version

    - name: Install uv (documented dependency manager)
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

    - name: Provision Python 3.11 (uv-managed, host-agnostic)
      # GitHub-hosted ubuntu images no longer preinstall 3.11; uv
      # fetches its managed build when absent (self-hosted: a no-op).
      # Runs AFTER the uv install so both tiers share one path.
      run: |
        uv python install 3.11
        uv run python --version

    - name: Install dependencies (locked)
      run: uv sync --locked

    - name: Fast unit tier (xdist parallel)
      # loadgroup keeps the machine-lock family + lock-probe module on one
      # worker; the fast tier is their complement on this leg.
      run: uv run python -m pytest -m "fast and not docs" -n auto --dist loadgroup -q --junitxml=.pytest-fast.xml

    - name: Upload fast-tier junit (observation artifact)
      continue-on-error: true
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: pytest-fast-junit-${{ github.sha }}
        path: .pytest-fast.xml
        if-no-files-found: error

  integration:
    # env-bound leg: the eval-native tier needs our host
    # toolchains (aarch cross-compiler, exec-permitted fixtures) —
    # ubuntu-latest runs it RED (PermissionError / symbol-not-found,
    # observed 2026-10-07). Owner routing: self-hosted first; this
    # leg IS the self-hosted-shaped one. The three shorts run in
    # parallel on the free tier, so this slot is the only queue.
    runs-on: [self-hosted, python-3.11]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Ensure git
      run: |
        if ! command -v git >/dev/null 2>&1; then
          sudo apt-get update && sudo apt-get install -y git
        fi
        git --version

    - name: Install uv (documented dependency manager)
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

    - name: Provision Python 3.11 (uv-managed, host-agnostic)
      # GitHub-hosted ubuntu images no longer preinstall 3.11; uv
      # fetches its managed build when absent (self-hosted: a no-op).
      # Runs AFTER the uv install so both tiers share one path.
      run: |
        uv python install 3.11
        uv run python --version

    - name: Install dependencies (locked)
      run: uv sync --locked

    - name: Integration + slow tier (xdist parallel)
      # #463 quality-gate framework: coverage is OBSERVATION only.
      # pytest.ini MUST NOT carry --cov-fail-under; we pass --cov here just
      # so the report lands in CI artifacts. Coverage % is NOT a gate.
      # The quality gates (names/registry: devkit/quality_gates.py GATES)
      # are documented in devkit/docs/quality_gates.md and run via
      # `uv run python devkit/quality_gates.py` (Gate 2 IS pytest green,
      # but Coverage / Test-Count are observation not KPI).
      run: uv run python -m pytest -m "not fast" -n auto --dist loadgroup -q --junitxml=.pytest-result.xml --cov=scripts --cov=hooks --cov-report=xml --cov-report=term

    - name: Upload coverage report (observation only, #463)
      continue-on-error: true
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: coverage-${{ github.sha }}
        path: coverage.xml
        if-no-files-found: warn

    - name: Run quality-gate framework (Gate 1 / 3 / 4 / 8 / 9)
      # Gate 2 = pytest green (previous step). The other gates:
      # Gate 1 = contract modules importable; Gate 3 = collect-only clean;
      # Gate 4 = mutmut available; Gate 8 = governance binding (#867 —
      # deprecated live callers / SKILL teaching shape / evals
      # reconciliation); Gate 9 = tools/ CLI discovery-face registration
      # (#866 — _INDEX.yaml registry + SKILL/references teaching, baseline
      # ratchet). Cross-platform Python, NOT bash.
      run: uv run python devkit/quality_gates.py 1 3 4 8 9

    - name: Oracle self-check (issue #121)
      run: uv run python scripts/kunglao_eval.py --oracle-selfcheck

    - name: Generate release receipt
      # The receipt counts the integration+slow junit (this leg). The fast
      # and docs legs upload their junit artifacts alongside it, so the
      # union is auditable from the three artifacts.
      run: uv run python scripts/release_receipt.py --pytest-junit .pytest-result.xml --out release-receipt.json

    - name: Upload release receipt
      # observation artifact, not a gate — self-hosted runners hit transient
      # ECONNRESET on the artifacts endpoint; the receipt is also printed in logs
      continue-on-error: true
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: release-receipt-${{ github.sha }}
        path: release-receipt.json
        if-no-files-found: error
