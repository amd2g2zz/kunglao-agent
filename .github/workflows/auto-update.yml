name: auto-update plugin version

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  bump-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Bump plugin.json version
        # replaces the removed third-party tj-actions/json-files-action@v1
        # (repo 404 since 2026-09-03, broke every tag push); jq ships on
        # ubuntu-latest and needs no pinning surface.
        run: |
          jq --arg v "${{ steps.version.outputs.VERSION }}" \
            '.version = $v' .claude-plugin/plugin.json > plugin.json.tmp
          mv plugin.json.tmp .claude-plugin/plugin.json

      - name: Bump marketplace.json plugin entry version
        run: |
          jq --arg v "${{ steps.version.outputs.VERSION }}" \
            '(.plugins[] | select(.name == "kunglao-agent") | .version) = $v' \
            .claude-plugin/marketplace.json > marketplace.json.tmp
          mv marketplace.json.tmp .claude-plugin/marketplace.json

      - name: Open auto-bump PR
        run: |
          git config user.name 'kunglao-bumper'
          git config user.email 'bumper@users.noreply.github.com'
          git checkout -b auto-bump-v${{ steps.version.outputs.VERSION }}
          git add .claude-plugin/plugin.json .claude-plugin/marketplace.json
          git commit -m "chore: auto-bump version to ${{ steps.version.outputs.VERSION }}"
          git push -u origin auto-bump-v${{ steps.version.outputs.VERSION }}
          gh pr create \
            --repo amd2g2zz/kunglao-agent \
            --base master \
            --head auto-bump-v${{ steps.version.outputs.VERSION }} \
            --title "chore: auto-bump plugin manifest to ${{ steps.version.outputs.VERSION }}" \
            --body "Triggered by tag \`${{ steps.version.outputs.VERSION }}\` via .github/workflows/auto-update.yml."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
