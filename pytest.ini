[pytest]
testpaths = tests
# tools/* subdirs (#340 layout): flat module imports - each category dir and
# tools/_lib are import roots (disasm_constant_check, lib_disasm, ...).
pythonpath = . hooks scripts tools tools/_lib tools/static tools/auxiliary tools/pipelines
markers =
    load_sensitive: tick-chain/static-tools modules that must never co-run across concurrent pytest processes (#369) — serialized by a machine-local file lock; deselect with -m "not load_sensitive"
filterwarnings =
    ignore::DeprecationWarning
