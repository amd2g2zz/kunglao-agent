# gc-harness/config.yaml — #720 v1 defaults (spec-of-record §11).
spec:
  require_existing_check: true
  orphan_days: 90

test:
  quarantine_days: 30
  stale_failure_days: 180

worktree:
  merged_days: 7
  abandoned_days: 14

# code leg — surfaces that keep a module/symbol alive (dispatch-surface
# liveness). Case-folded substring match over the declared files/globs.
code:
  surfaces:
    - scripts/mechanisms.yaml
    - deploy-manifest.yaml
    - tools/_INDEX.ext.yaml
    - scripts/README.md
    - agents/*.md
    - skills/**
    - hooks/*.py
    - tests/**
    - gc-harness/**

budget:
  max_new_spec: 1
  max_new_test: 5
  max_new_files: 20
