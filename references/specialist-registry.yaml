specialists:
- claim_types:
  - symbol-recovery
  - function-identification
  description: Go symbol recovery via unstrip
  name: go-symbols
  triggers:
    exclude:
    - Rust
    - .NET
    - C#
    must_any:
    - Go
    - golang
    - go-binary
- claim_types:
  - signature-analysis
  - packer-detection
  description: PE Authenticode signature + packer detection
  name: pefile-signature
  triggers:
    must_any:
    - Authenticode
    - PE signature
    - packer
    - digital signature
- claim_types:
  - string-analysis
  description: FLARE-FLOSS string extraction and filtering
  name: floss-filter
  triggers:
    must_any:
    - strings
    - floss
    - string analysis
- claim_types:
  - static-re
  - decompilation
  description: Stage 4 light static reconnaissance via Ghidra
  name: ghidra-light
  triggers:
    exclude:
    - .NET
    - C#
    must_any:
    - decompile
    - disassemble
    - xref
    - Ghidra
    - static analysis
- claim_types:
  - verdict
  description: Final verdict scoring
  name: verdict-scorer
  triggers:
    must_any:
    - verdict
    - scoring
    - final assessment
- claim_types:
  - '*'
  description: Generic fallback
  fallback: true
  name: kunglao-worker
  triggers: {}
