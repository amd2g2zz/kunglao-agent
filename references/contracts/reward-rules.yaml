schema: reward-rules/1
version: 4
description: >
  Deterministic settlement rules for the unified rollout ledger (#366).
  THE reward currency contract: rlvr/reward.py reads ONLY this table
  and only machine-recorded signals. Settlement rewards are NEVER model
  opinions (owner ruling 2026-09-23) — signals produced by a model enter
  the ledger marked advisory and are excluded from rule matching by
  construction; no rule below names a model source. Every rule requires at
  least two distinct signals (multi-signal anti-pollution: recall_useful
  is a model self-report, no single signal settles a band alone).
  Rules are evaluated in declared `order`; the FIRST full match settles.

  version 2 (#379): fine-grained tier bands over MECHANICAL dimensions —
  the episode settlement refines the v1 polarity bands with a tiered
  scalar (tier_table below), plus the round-credit formula and the
  experience 3-tuple. Zero free weights except the ONE cost parameter k,
  earned from the exp1-7 measured cost distribution (cited in
  cost_reference below). The /1 rows above remain foldable unchanged;
  settled() interface unchanged; adapters unchanged.

  version 3 (issue 433): round-credit VALUE LADDER (anti fact-farming
  value alignment) — verified demotes from sufficient condition to
  ADMISSION TICKET; cited / used-toward-stage is the value condition;
  verified-but-never-cited and replay-evidence refutations settle the
  TRACE canonical, once per demotion class per dispatch row. V/dV and
  the root layers are unchanged; process quality (D4/D5/cost) stays in
  the MEASUREMENT dimensions, never in the VALUE dimension.

  version 4 (issue 796, the Φ-tree economy): the hypothesis rule
  classes. `hypothesis/decisive-resolution` settles credit ONLY on a
  decisive ΔΦ (≥ the documented threshold, with a machine witness or
  an independent referee confirmation) and `hypothesis/churn` bands
  the clawback (overturning a credited node revokes its escrowed
  credit against the PROPOSING step plus the documented penalty, on
  the signed negative face). The row contract pairs the two axes:
  every credited resolution row carries BOTH the ΔΦ valuation AND the
  proposing-step attribution ref — missing either, the row is invalid.
  The settled AMOUNT for a decisive row is the machine-recorded ΔΦ
  (the closure-tree state diff — never a model opinion); the table's
  numeric reward is the SIGN indicator only. Assertion-only flips
  settle NEUTRAL. The machine evaluation face is rlvr/phi_tree.py.

  issue 1007 (the reward-unit contract, declarative): the `reward`
  field is NOT one unit across rollout kinds — see the reward_units
  block below. Settlement scalars are [0,1]; the round_credit
  provenance sum is in credit units and is deliberately unclamped.
  This declaration changes NO value and settles no row differently.

bands:
  SETTLED_GREEN: {reward: 1.0, polarity: positive}
  SETTLED_RED:   {reward: 0.0, polarity: negative}
  ADVERSE:       {reward: 0.0, polarity: negative}
  HELPED:        {reward: 0.5, reward_full: 1.0, polarity: positive}
  NEUTRAL:       {reward: 0.0, polarity: none}
  SETTLED_CREDIT: {reward: 1.0, reward_note: "sign indicator only —
    the settled AMOUNT is the machine-recorded ΔΦ on the row",
    polarity: positive}
  CLAWBACK:      {reward: 0.0, reward_note: "the negative leg rides
    the signed phi-clawback/1 face (clawed credit + penalty)",
    polarity: negative}

# --- reward units per row kind (issue 1007) --------------------------------
# The `rollout-ledger/1` schema declares one reward UNIT per kind
# (rlvr.ledger.KIND_REWARD_RAILS is the machine face; this block is the
# contract page). A consumer that expects a probability reads
# rlvr.ledger.reward_rail_of(row) and EXCLUDES + REPORTS provenance rows
# instead of treating their value as a reward (rlvr.reward.
# bounded_reward_rows / bounded_prior_observations; compute_priors reports
# the exclusion under sources.rollout_ledger.excluded).
reward_units:
  bounded:
    rail: bounded
    kinds: [task, self_distill, hybrid_distill, hypothesis]
    field: reward
    range: [0.0, 1.0]
    note: >
      Settlement scalars — the v1 bands, the v2 tier scalars, and the
      v4 hypothesis sign indicator. The [0,1] rail is enforced by
      scalar.clamp_credit / rail_of on the settlement path and by
      ledger.row_schema_lint at the write/read boundary.
  provenance:
    rail: provenance
    kinds: [round_credit]
    field: credit_units
    range: unbounded
    note: >
      The per-dispatch round-credit value is a PROVENANCE SUM in credit
      units, not a reward: r_i = full-credit cited artifacts x 1.0 +
      one trace total per demotion class present x 0.01 - attributed
      waste. The issue-1007 fixture is exactly 2 x 1.0 (F004, F005
      credited) + 1 x 0.01 (F006/F007 share the cited_over_cap demotion
      class) - 0 waste = 2.01. Clamping would erase the difference
      between citing one and two artifacts, so the value is NOT
      clamped; the row instead carries `reward_rail: provenance` and
      `credit_units` in its settlement. Provenance sums may be negative
      when attributed waste exceeds credited artifacts.
  signed:
    rail: signed
    kinds: [mainline_decision, method_memory, strategy_memory]
    field: reward
    range: unbounded
    note: >
      Pre-existing signed-ΔV / signed-reward attribution rows (the
      situation-stream mainline replay and the review-bridge
      attribution carriers). Neither a [0,1] reward nor a credit sum:
      the value IS the signed ΔV / attributed reward. Declared here so
      the per-kind range is complete; the issue-1007 bounded consumer
      excludes these rows as well.
rules:
  - rule_id: task/oracle-green
    kind: task
    order: 1
    requires:
      - {type: oracle_verdict, equals: pass}
      - {type: claim_terminal, in: [PROVEN, VERIFIED]}
    band: SETTLED_GREEN
    reward: 1.0
    evidence: [runs/oracle-status.json, claim-register.yaml]
    never_demoted: true   # the oracle checker verdict is the hard currency

  - rule_id: task/oracle-red
    kind: task
    order: 2
    requires:
      - {type: oracle_verdict, equals: fail}
      - {type: claim_terminal, in: [NEGATIVE, REFUTED]}
    band: SETTLED_RED
    reward: 0.0
    evidence: [runs/oracle-status.json, claim-register.yaml]

  - rule_id: self_distill/adverse
    kind: [self_distill, hybrid_distill]
    order: 3
    requires:
      - {type: misleading_declaration, equals: true}
      - {type: zero_recall, equals: true}
      - {type: no_citation, equals: true}
    band: ADVERSE
    reward: 0.0
    evidence: [verdict surface, recall telemetry, lessons telemetry]

  - rule_id: self_distill/helped
    kind: [self_distill, hybrid_distill]
    order: 4
    requires:
      - {type: distill_consumption, min_count: 1}
      - {type: downstream_positive_reference, equals: true}
    optional:
      - {type: distill_reuse, min_count: 2}
    band: HELPED
    reward: 0.5
    reward_full: 1.0     # when every optional predicate holds too
    evidence: [distill engine consumption rows, convergence ledger]

  # --- v4: the hypothesis rule classes (issue 796, Φ-tree economy) -----
  # Machine evaluation face: rlvr/phi_tree.py. Signals come from the
  # machine-recorded tree state diff + the evidence store — no model
  # source anywhere; the decisive rule's three signals are each
  # independent (the multi-signal anti-pollution floor holds).

  - rule_id: hypothesis/decisive-resolution
    kind: hypothesis
    order: 5
    requires:
      - {type: resolution_decisive, equals: true}
      - {type: machine_witness, equals: true}
      - {type: delta_phi_at_threshold, equals: true}
    band: SETTLED_CREDIT
    reward: 1.0          # SIGN indicator only; the AMOUNT is the row's
                         # machine-recorded ΔΦ (escrowed until the
                         # claim's terminal reconcile releases it)
    evidence: [runs/experience.jsonl, hypotheses/ tree state diff]

  - rule_id: hypothesis/churn
    kind: hypothesis
    order: 6
    requires:
      - {type: churn_clawback, equals: true}
      - {type: escrow_attribution, equals: true}
    band: CLAWBACK
    reward: 0.0          # the negative leg rides the signed
                         # phi-clawback/1 face: clawed credit + penalty
                         # against the PROPOSING step; never folded
                         # into any non-negative credit stream
    evidence: [runs/experience.jsonl, runs/planning-actions.jsonl]

# --- v2: the tiered scalar (episode settlement, #379) --------------------
# scalar_settlement.py consumes THIS section + the machine signals on the
# task-kind rows. Pure if-then over the dimensions — no judgment slots, no
# numeric weights: each tier is an ENTRY CONDITION, evaluated FIRST-MATCH
# in severity_order. The tier scalar refines WITHIN the v1 band (it can
# never raise a SETTLED_RED row or lower a SETTLED_GREEN row's ledger
# reward); the v1 bands stay the polarity currency.
tier_table:
  scalars:
    GOLD: 1.0
    SILVER: 0.7
    BRONZE: 0.4
    NEUTRAL: 0.0
    RED: 0.0
  severity_order: [RED, GOLD, SILVER, BRONZE, NEUTRAL]
  red_override: true      # an oracle-fail is RED regardless of the other dims
  min_machine_signals: 2  # anti-pollution: no single signal settles a tier
  expensive_rule: tier/bronze-expensive   # the INEFFICIENT fold (see below)
  partial_rule: tier/partial-dense
  dimensions:
    outcome:
      source: >
        oracle_verdict (runs/oracle-status.json via oracle_runner) +
        checker probe sub-scores (static X/Y and replay N/M from the
        kunglao-eval evidence faces, scripts/eval_checker.py) + chain
        dense layers-completed/N (kunglao-eval-chain-scores/1,
        scripts/eval_chain_grader.py). PASS / partial(p) / FAIL; a FAIL
        verdict with >0 mechanical progress (any sub-score) is partial(p).
    difficulty:
      source: >
        unit_manifest (eval/v1/tasks/<tier>/<task_id>/task.yaml): the
        chain gradient / tier resistance marker; hard vs standard.
    evidence:
      source: >
        rerun_discipline: evidence_class on the fact frontmatter
        (rerun-reproducible vs asserted-only; the rerun/replay
        discipline's recorded grade).
    cost:
      source: >
        cost_telemetry session_cost (USD, session cost report) compared
        against the unit-class reference in cost_reference below keyed by
        strategy_arm unit_class.
    tuple_s:
      source: >
        unit_manifest family + tier (+ the difficulty dimension) — the
        situation features of the experience 3-tuple.
    tuple_a:
      source: >
        strategy_arm + method_choices (the eval results row's arm face /
        the loop runner's governed-iteration choices).

# --- v2: the ONE free parameter k, earned from measured data -------------
cost_reference:
  measured_source: >
    exp1-7 measured cost distribution (issue #379 record + README
    Benchmarks, 12-unit L1 eval matrix, measured 2026-09-25): plain
    cc-default arm ~$11.4 total over 12 units = ~$0.95/unit (issue band
    ~$1-2/unit); kunglao loop arm ~$120-135 per 12-unit campaign =
    $5-15/unit; exp7 measured that at a labeled $30/session cap the
    budget-bound unit passes — the pass-but-expensive boundary is real
    and sits at 3x the loop class median.
  unit_class_median_usd:
    cc-default: 1.5     # measured ~$0.95-2/unit
    loop: 10.0          # measured $5-15/unit, median of the band
  k: 3.0                # INEFFICIENT above k * class median
  note: >
    k = 3 anchors the loop class at $30/session — exactly the exp7
    measured higher-cap boundary. cost <= median keeps GOLD/SILVER
    reachable; median < cost <= k*median falls to BRONZE; cost > k*median
    is the issue's INEFFICIENT tier (pass-but-expensive), folded into the
    BRONZE scalar 0.4 and named tier/bronze-expensive — the documented
    per-rollout efficiency discount.

# --- v3: round credit settlement (#379 spec + issue 433 value ladder) -----
# Issue 1007: this section's value is on the PROVENANCE rail — a sum in
# credit units (see reward_units.provenance), never a [0,1] reward.
round_credit:
  reward_rail: provenance       # issue 1007 — NOT a [0,1] reward
  credit_field: credit_units    # the settled provenance sum (credit units)
  formula: >
    r_i = (full-credit artifacts created in dispatch i) + (one trace
    total per demotion class present in dispatch i) - attributed waste
    (decoy-follow walls traced to dispatch i).
  value_ladder:
    full: 1.0
    trace: 0.01          # the validator rails' TRACE canonical, reused
    legs:
      cited_or_used_toward_stage_verified: full
      refuted_with_replay_evidence: trace
      uncited_verified: trace
      action_success_tool_ran: 0.0
    note: >
      Issue 433 (anti fact-farming): verified is the ADMISSION TICKET,
      cited / used-toward-stage is the VALUE CONDITION — a verified fact
      nobody cites is an exploration option, worthless until cited. The
      citation relation is mechanical: named by the deliverable
      (cited_by_deliverable) OR linked via claim provenance to a
      question-bearing claim (fact claim_id -> claim-register
      answers_question non-null — the surface the verdict scorer walks).
      The uncited demotion is a CLASS demotion: one trace total per
      dispatch row per demotion class, never a per-unit price — N farmed
      facts earn the same single exploration-option value as one. A late
      citation back-promotes the fact to full through the amendment path
      (append-only ledger rows, promoted ids named in the settlement):
      no punishment for foresight, no farming of uncited facts.
      Stage-milestone artifacts (layer falls, key recovered) have NO
      separate leg — the stage_milestone declaration was removed
      (issue 438 minor tail: it had no settlement face): a milestone
      is stage use by construction and earns full credit through the
      cited/used-toward-stage leg when the citation relation names it;
      an unlinked milestone settles as the exploration-option trace —
      the disclosed under-credit-only assumption. The existing V-jump
      attribution face, V/dV, and the root layers are unchanged. Owner
      ruling 2026-09-28: within-cell
      homogeneity is a STATE-SIGNATURE property, not a reward property —
      NO reward-side normalization (no z-score, no rescaling); the cell
      structure already conditions the comparison.
  attribution: >
    provenance-exact via the fact frontmatter creator field (the dispatch
    trace id the worker echo'd at creation). NO positional discount: the
    round index orders rows, it never weights them.
  positional_discount: false
  untraced:
    counted: false
    note: >
      an artifact with no creator field is listed credit:untraced and
      counts toward no dispatch.
  band: ROUND_CREDIT    # polarity none — feeds no Beta prior; the scalar
                        # posterior reads episode tier scalars only.

# --- v2: the experience 3-tuple (settlement output) -----------------------
experience_tuple:
  note: >
    (s, a, r) extracted AT settlement (the tuple's birth certificate):
    s = situation features (family x tier x difficulty, unit manifest);
    a = strategy/action (strategy arm + key method choices);
    r = the settled tier scalar. The tuple store is the RL experience
    base; the contextual Q table (M1) is its soft-Q view. Extracted as
    the settlement document's experience_tuple field — never derived
    retroactively.
